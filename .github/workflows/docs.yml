name: docs

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "worker/**"
      - "scripts/pages/**"
      - "scripts/docs/**"
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "web/**"
      - "worker/**"
      - "scripts/pages/**"
      - "scripts/docs/**"
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/docs/package-lock.json

      - name: Install docs tooling
        run: npm ci --prefix scripts/docs

      - name: Generate facts and render diagrams
        run: |
          node scripts/docs/generate.mjs --write
          node scripts/docs/render.mjs

      - name: Fail when generated docs are stale
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain -- docs)" ]; then
            git status --short -- docs
            echo "Generated docs are stale. Run the two commands in docs/README.md and commit the result."
            exit 1
          fi

      - name: Commit generated docs
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          !contains(github.event.head_commit.message, '[skip docs]') &&
          vars.DOCS_AUTOCOMMIT != 'false'
        run: |
          if [ -z "$(git status --porcelain -- docs)" ]; then
            echo "docs already current"
            exit 0
          fi
          git config user.name "bankpipe-docs[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "docs: regenerate diagrams and facts [skip docs]"
          git push
