name: ui

on:
  pull_request:
    paths:
      - "web/index.html"
      - "scripts/check-ui-tokens.mjs"
      - ".opencode/skills/bankpipe-ui/**"
      - ".github/workflows/ui.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tokens:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: No new off-scale UI tokens
        if: github.event_name == 'pull_request'
        run: node scripts/check-ui-tokens.mjs --range "origin/${{ github.base_ref }}...HEAD"
