name: privacy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-repository:
    runs-on: ubuntu-latest
    steps:
      - name: Require a private repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          private="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)"
          if [ "$private" != "true" ]; then
            echo "::error::This repository must stay private."
            exit 1
          fi
