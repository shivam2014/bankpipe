window.bpRunReimport = async (file) => {
  if (!file) return;
  const status = (text) => {
    const a = document.getElementById("reimport-confirm-status");
    const b = document.getElementById("reimport-status");
    if (a) a.textContent = text;
    if (b) b.textContent = text;
  };
  const unlocked = await ensureUnlocked();
  if (!unlocked) return; // unlock screen; resumePendingReimport continues after unlock
  window.bpPendingReimportConfirmed = false;
  status("Reading the workbook…");
  showImportProgress(2, "Reading the workbook", "Checking the file before anything is cleared.");
  // Read it before clearing anything. A wrong or corrupt file must not wipe
  // the current database.
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: "array", cellDates: false });
    if (!wb.SheetNames.length) throw new Error("no sheets");
    const sample = wb.SheetNames.slice(0, 4).map((n) => {
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: false, defval: "" });
      return rows.slice(0, 30).flat().map(String).join(" ");
    }).join(" ");
    if (/redacted/i.test(file.name) || /redacted|login details redacted|amount redacted/i.test(sample)) {
      status("This is the redacted audit copy. Choose the original workbook, not redacted_file.xlsm.");
      showImportProgress(100, "Import stopped", "This is the redacted audit copy. Choose the original workbook.", true);
      return;
    }
  } catch (e) {
    status("Cannot read this workbook. Nothing was changed.");
    showImportProgress(100, "Import stopped", "Cannot read this workbook. Nothing was changed.", true);
    return;
  }
  let profile;
  try {
    const [res, planRes] = await Promise.all([
      fetch("./profiles/family-workbook.json", { cache: "no-store" }),
      fetch("./profiles/family-assets-plan.json", { cache: "no-store" }),
    ]);
    if (!res.ok) throw new Error("profile not found");
    profile = await res.json();
    if (planRes.ok) window.bpAssetPlan = await planRes.json();
  } catch (e) {
    status("Cannot load the family workbook profile. Nothing was changed.");
    showImportProgress(100, "Import stopped", "Cannot load the family workbook profile. Nothing was changed.", true);
    return;
  }
  window.bpProfile = profile;
  const store = await import("./db.js");
  try {
    const manual = manualSnapshot(await store.listAccounts());
    status("Saving a version of the current data…");
    try { await store.snapshotDb("Before workbook re-import"); } catch (e) {}
    status("Clearing the old import…");
    showImportProgress(4, "Clearing the old import", "The passphrase and vault are kept.");
    await store.clearAll();
    localStorage.setItem("bp.mode", "real");
    go("import");
    await new Promise((r) => setTimeout(r, 0));
    status("Importing… this can take a minute.");
    showImportProgress(6, "Importing the workbook", "This can take a minute.");
    await importWorkbook(file);
    await restoreManualAccounts(store, manual);
    window.bpPendingReimport = null;
    window.bpPendingReimportConfirmed = false;
  } catch (e) {
    const out = document.getElementById("wres");
    if (out) out.innerHTML = `<div class="card pad" style="margin-top:10px;color:var(--red)">
      Import failed: ${esc(String(e.message || e))}</div>`;
    showImportProgress(100, "Import failed", String(e.message || e), true);
  }
};

function flowMonthLabel(month) {
  return new Date(month + "-01T00:00:00Z").toLocaleString("en-IN",
    { month: "short", year: "numeric", timeZone: "UTC" });
}
function flowMonthEnd(month) {
  const [y, m] = month.split("-").map(Number);
  return new Date(Date.UTC(y, m, 0)).toISOString().slice(0, 10);
}
function flowCardHtml(months, selected, opts = {}) {
  window.bpFlowMonths = months;
  const sel = months.find((m) => m.month === selected) || months[0] || null;
  if (sel) window.bpFlowMonth = sel.month;
  const net = sel ? (sel.inn || 0) - (sel.out || 0) : 0;
  const max = Math.max(1, ...months.map((m) => Math.max(m.inn || 0, m.out || 0)));
  const bar = (value, cls) => value > 0
    ? `<i class="${cls}" style="width:${Math.max(1, Math.round((value * 100) / max))}%"></i>` : "";
  const list = months.map((m) => {
    const n = (m.inn || 0) - (m.out || 0);
    const on = sel && m.month === sel.month;
    return `<button class="flow-month${on ? " is-on" : ""}" type="button"
      onclick="bpFlowSelect('${m.month}')" aria-pressed="${on ? "true" : "false"}"
      title="${m.n} transaction${m.n === 1 ? "" : "s"} in ${flowMonthLabel(m.month)}">
      <span class="fm">${flowMonthLabel(m.month)}</span>
      <span class="fb">${bar(m.inn || 0, "in")}${bar(m.out || 0, "out")}</span>
      <span class="fn ${n < 0 ? "neg" : "pos"}">${n < 0 ? "−" : "+"}${compact(Math.abs(n))}</span>
    </button>`;
  }).join("");
  return `<div class="card pad" id="flow-card">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap">
      <h2 style="margin:0">Cash flow</h2>
      <div class="muted" style="font-size:11.5px">${sel ? `${sel.n} transaction${sel.n === 1 ? "" : "s"}`
        : "no months yet"}</div></div>
    ${sel ? `<div class="flow-top">
      <div><div class="k">In</div><div class="v pos">${money(sel.inn || 0)}</div></div>
      <div><div class="k">Out</div><div class="v neg">${money(sel.out || 0)}</div></div>
    </div>
    <div class="flow-net"><span class="k">Net</span>
      <span class="v ${net < 0 ? "neg" : "pos"}">${money(net)}</span></div>`
      : `<div class="muted" style="font-size:13px;margin-top:8px">No transactions yet.
      Import a bank statement to see monthly in, out and net.</div>`}
    ${months.length ? `<div class="flow-list">${list}</div>
      <div class="flow-foot"><span class="muted">${months.length} month${months.length === 1 ? "" : "s"}
        · green in, red out · pick one for its totals</span>
        ${sel && opts.open !== false ? `<button class="btn" style="padding:4px 9px;font-size:12px"
          onclick="bpFlowOpen('${sel.month}')">Open month</button>` : ""}</div>` : ""}
  </div>`;
}
window.bpFlowSelect = (month) => {
  window.bpFlowMonth = month;
  const el = document.getElementById("flow-card");
  if (el) el.outerHTML = flowCardHtml(window.bpFlowMonths || [], month);
};
window.bpFlowOpen = (month) => {
  if (!month) return;
  window.bpTxFilter = { q: "", from: month + "-01", to: flowMonthEnd(month), min: "",
    max: "", account: "", page: 0, limit: 200 };
  go("transactions");
};

window.bpRestoreSnapshot = async (key) => {
  if (!confirm("Restore this version? The current data is saved as a version first, then the "
    + "page reloads. You will need the passphrase that was active when the version was taken.")) return;
  try {
    const store = await import("./db.js");
    await store.snapshotDb("Before restore");
    await store.restoreDbSnapshot(key);
    location.reload();
  } catch (e) {
    alert("Could not restore: " + (e.message || e));
  }
};
// A snapshot is already sealed, so it leaves as the same bytes the browser
// would restore from: the file is a backup, not a plaintext export.
window.bpDownloadSnapshot = async (key) => {
  try {
    const store = await import("./db.js");
    const snap = await store.readDbSnapshot(key);
    const when = snap.at ? new Date(snap.at) : new Date();
    const url = URL.createObjectURL(new Blob([snap.data], { type: "application/octet-stream" }));
    const a = document.createElement("a");
    a.href = url;
    a.download = `bankpipe-snapshot-${fileStamp(when)}.bpk`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (e) {
    alert("Could not download the snapshot: " + (e.message || e));
  }
};
window.bpDeleteSnapshot = async (key) => {
  if (!confirm("Delete this local version?")) return;
  try {
    const store = await import("./db.js");
    await store.deleteDbSnapshot(key);
    await window.bpLoadSnapshots();
  } catch (e) {
    alert("Could not delete: " + (e.message || e));
  }
};
window.bpStoreLegacyMeta = async () => {
  const input = document.getElementById("legacy-meta");
  const note = document.getElementById("legacy-meta-status");
  const files = [...(input?.files || [])];
  if (!files.length) { if (note) note.textContent = "Choose the JSON files first."; return; }
  const store = await import("./db.js");
  const results = [];
  for (const file of files) {
    let data;
    try { data = JSON.parse(await file.text()); }
    catch (e) { results.push(`${file.name}: not JSON`); continue; }
    const name = file.name.toLowerCase();
    const key = name.includes("account-meta") ? SSOT_KEYS.accountMeta
      : name.includes("owners") ? SSOT_KEYS.owners
      : name.includes("total-supplement") ? SSOT_KEYS.totalSupplement
      : null;
    if (!key) { results.push(`${file.name}: unknown file`); continue; }
    await store.setSetting(key, JSON.stringify(data));
    results.push(`${file.name}: stored`);
  }
  if (note) note.textContent = results.join(" · ");
  input.value = "";
};

function demoAssets() {
  const out = [];
  for (const a of DATA.accounts || []) {
    out.push({ id: a.id, category: "bank", label: a.label || a.bank, bank: a.bank,
      number: a.number, holder: a.holder, city: a.city,
      balance: a.balance, facts: a.balance === null ? 0 : 1 });
  }
  for (const [cls, h] of Object.entries(DATA.holdings || {})) {
    const category = cls === "equity" || cls === "mf" ? "demat"
      : cls === "ppf" ? "fd" : cls;
    for (const r of h.rows || []) {
      const d = r.details || {};
      const meta = { source: "sample" };
      if (category === "insurance") {
        meta.premium_paise = r.value;
        meta.sum_assured_paise = d.sum_assured || null;
      }
      out.push({ id: `demo-${cls}-${r.id}`, category, label: r.label, holder: r.holder,
        value_paise: r.value, meta,
        start_date: d.started || null,
        maturity_date: d.matures || d.maturity || null,
        rate_bps: d.rate || null });
    }
  }
  return out;
}
function demoMonths() {
  if (Array.isArray(DATA.flows) && DATA.flows.length) return DATA.flows;
  const byMonth = new Map();
  for (const t of loadTxns()) {
    if (/Transfer (to|from)/i.test(t.description || "")) continue;
    const month = String(t.date || "").slice(0, 7);
    if (!month) continue;
    const row = byMonth.get(month) || { month, inn: 0, out: 0, n: 0 };
    if (t.amount > 0) row.inn += t.amount; else row.out += -t.amount;
    row.n += 1;
    byMonth.set(month, row);
  }
  return [...byMonth.values()].sort((a, b) => b.month.localeCompare(a.month));
}
function demoDueItems() {
  const today = new Date().toISOString().slice(0, 10);
  return (DATA.upcoming || [])
    .filter((e) => e.date >= today)
    .slice(0, 4)
    .map((e) => {
      const days = Math.ceil((Date.parse(e.date) - Date.parse(today)) / 86400000);
      const d = new Date(e.date + "T00:00:00Z");
      return { ...e,
        monthShort: d.toLocaleString("en-IN", { month: "short", timeZone: "UTC" }).toUpperCase(),
        day: e.date.slice(8, 10), year: e.date.slice(0, 4),
        when: days === 0 ? "today" : days === 1 ? "tomorrow" : `in ${days} days`,
        dot: e.class === "bonds" ? "var(--blue)" : e.class === "insurance" ? "var(--amber)" : "var(--green)" };
    });
}

window.bpBondFetchAll = async (assetId) => {
  const note = (t) => {
    window.bpBondMarketNote = { id: assetId, text: t };
    const el = document.getElementById("bond-fetch-note");
    if (el) { el.textContent = t; el.style.display = t ? "" : "none"; }
  };
  const store = await import("./db.js");
  const all = await store.listHoldings(assetId);
  // A matured lot has no price and no next interest; it is not worth a lookup.
  const lots = splitMatured(all).current
    .filter((h) => /^IN[A-Z0-9]{10}$/.test(String(h.security_id || "").toUpperCase()));
  if (!lots.length) {
    note("No current lot carries an ISIN, so there is nothing to look up.");
    return;
  }
  const isins = [...new Set(lots.map((h) => String(h.security_id).toUpperCase()))];
  const got = new Map();
  const queue = [...isins];
  let read = 0, down = false;
  note(`Reading ${isins.length} ISIN${isins.length === 1 ? "" : "s"}…`);
  // Four at a time: SMEST answers in about a second and BSE is memoised per day.
  const worker = async () => {
    while (queue.length) {
      const isin = queue.shift();
      try {
        const res = await fetch(`/__market/bond?isin=${encodeURIComponent(isin)}`);
        got.set(isin, res.ok ? await res.json() : null);
      } catch (e) {
        got.set(isin, null);
        down = true;
      }
      read++;
      note(`Read ${read} of ${isins.length} ISIN${isins.length === 1 ? "" : "s"}…`);
    }
  };
  await Promise.all([worker(), worker(), worker(), worker()]);
  if (down && ![...got.values()].some(Boolean)) {
    note("Fetching needs the local app server. Opened as a plain file, it cannot run.");
    return;
  }
  let filled = 0, changed = 0, complete = 0, unread = 0, priced = 0, unpriced = 0;
  for (const h of lots) {
    const data = got.get(String(h.security_id).toUpperCase()) || null;
    const plan = bondFillPlan(h, data);
    if (!data?.details) unread++;
    else if (!plan.terms) complete++;
    if (plan.terms || plan.priced) {
      await store.upsertHolding(assetId, { ...h, ...plan.patch });
    }
    if (plan.added) filled++;
    if (plan.ratingChanged) changed++;
    // "Repriced" means the number moved; the same price is not news.
    if (plan.priced) { if (plan.patch.value_paise !== h.value_paise) priced++; }
    else if (data?.details) unpriced++;
  }
  const bits = [];
  if (filled) bits.push(`${filled} lot${filled === 1 ? "" : "s"} filled in`);
  if (changed) bits.push(`${changed} rating${changed === 1 ? "" : "s"} changed`);
  if (complete) bits.push(`${complete} already complete`);
  if (unread) bits.push(`${unread} could not be read`);
  if (priced) bits.push(`${priced} repriced from BSE`);
  if (unpriced) bits.push(`${unpriced} had no trade, so the value is unchanged`);
  note((bits.join(" · ") || "Nothing to do") + ".");
  window.bpAsset(assetId);
};

function bondLabelParts(h) {
  const p = parseBondLabel(h?.label);
  if (!p) return { name: h?.label || "", coupon: "", maturity: "" };
  const name = String(h.label).replace(/^\s*\d+(?:\.\d+)?\s*%\s*/, "")
    .replace(/\s*\d{1,2}\s+[A-Za-z]{3}\s+\d{4}\s*$/, "").trim();
  return { name, coupon: p.couponPct, maturity: p.maturity };
}
const BOND_MONTHS = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN",
  "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
function bondLabelText(name, coupon, iso) {
  const [y, m, d] = String(iso || "").split("-").map(Number);
  const mon = BOND_MONTHS[(m || 1) - 1] || "";
  return `${Number(coupon)}% ${String(name || "").trim()} ${String(d || "")
    .padStart(2, "0")} ${mon} ${y || ""}`.trim();
}

// One click on the ISIN asks the local server for the bond's terms (SMEST) and
// its last traded price (BSE). A new lot has nothing to lose, so it is filled;
// an existing lot keeps what it has until "Use fetched values" is pressed, so a
// fetch never silently replaces typed facts.
window.bpBondFetch = async (assetId, holdingId, overwrite = false) => {
  const msg = (t, bad) => {
    const el = document.getElementById("bh-fetchmsg");
    if (el) { el.textContent = t; el.style.color = bad ? "var(--red)" : "var(--muted)"; }
  };
  const applyBtn = document.getElementById("bh-apply");
  const isin = (document.getElementById("bh-isin")?.value || "").trim().toUpperCase();
  if (!/^IN[A-Z0-9]{10}$/.test(isin)) {
    if (applyBtn) applyBtn.style.display = "none";
    msg("An ISIN has 12 characters, like INE342T07429.", true);
    return;
  }
  msg("Looking up the bond…");
  let data = null;
  try {
    const res = await fetch(`/__market/bond?isin=${encodeURIComponent(isin)}`);
    if (res.status === 404) {
      if (applyBtn) applyBtn.style.display = "none";
      msg("SMEST does not list this ISIN. Type the rating and dates by hand.", true);
      return;
    }
    if (!res.ok) throw new Error(String(res.status));
    data = await res.json();
  } catch (e) {
    if (applyBtn) applyBtn.style.display = "none";
    msg("Details need the local app server. Opened as a plain file, this lookup cannot run.", true);
    return;
  }
  const store = await import("./db.js");
  const rows = holdingId ? await store.listHoldings(assetId) : [];
  const row = rows.find((r) => String(r.id) === String(holdingId)) || {};
  const units = Number(document.getElementById("bh-units")?.value || row.quantity) || 0;
  const fields = bondPrefill(data.details, { quantity: units });
  const force = overwrite || !holdingId;
  let keptCount = 0;
  const set = (id, v) => {
    const el = document.getElementById(id);
    if (!el || v === null || v === undefined || v === "") return;
    if (!force && String(el.value).trim()) { keptCount++; return; }
    el.value = String(v);
  };
  if (fields) {
    set("bh-name", fields.name);
    set("bh-coupon", fields.coupon);
    set("bh-maturity", fields.maturity);
    set("bh-freq", fields.frequency);
    set("bh-rating", fields.rating);
    set("bh-payout-date", fields.interest_date);
  }
  const market = data.market;
  // A lot is worth face × units × price. SMEST knows the face; without it,
  // infer it the way the cards do, so a price alone still values the lot.
  let valuePaise = fields?.value_paise || null;
  if (market && !valuePaise) {
    const face = fields?.face || inferFace(
      parseMoney(document.getElementById("bh-cost")?.value || ""), units);
    if (face && units) valuePaise = Math.round(face * units * market.ltp);
  }
  if (valuePaise) set("bh-value", inr(valuePaise));
  window.bpBondLabelPreview();
  if (applyBtn) applyBtn.style.display = keptCount && !overwrite ? "" : "none";
  const bits = [];
  if (!fields) bits.push("no terms came back, so the fields are unchanged");
  else {
    if (fields.frequency) bits.push(`${fields.frequency.toLowerCase()} interest`);
    if (fields.rating) {
      const held = String(document.getElementById("bh-rating")?.value || "").trim();
      bits.push(held && held !== fields.rating
        ? `the rating has moved ${held} → ${fields.rating}` : `rated ${fields.rating}`);
    }
    const parts = data.details?.redemptions || [];
    if (parts.length > 1) {
      bits.push(`the principal comes back in ${parts.length} parts, `
        + `${dateLabel(parts[0])} to ${dateLabel(parts[parts.length - 1])}`);
    }
  }
  if (market) {
    bits.push(`BSE ${inr(Math.round(market.ltp * 100))} per ₹100 face on ${dateLabel(market.date)}`);
    if (valuePaise) bits.push(`this lot ${money(valuePaise)}`);
    else if (!units) bits.push("add units to value this lot");
  } else {
    bits.push("no BSE trade in the last 12 sessions, so type a market value if you have one");
  }

window.bpHoldingsSave = async (id) => {

  let bad = "";

  const bondTable = rows.some((h) => bondAnalytics(h));
  for (const h of rows) {
    const raw = (document.getElementById(`hv-${h.id}`)?.value || "").trim();
    if (bondTable) {
      const ba = bondAnalytics(h);
      if (!ba) continue;
      if (!raw) continue;
      const input = document.getElementById(`hv-${h.id}`);
      if (input && input.dataset.price !== undefined
        && Number(raw) === Number(input.dataset.price)) continue;
      const price = Number(raw);
      if (!Number.isFinite(price) || price <= 0) {
        bad = `That price does not look right: ${raw}`;
        break;
      }
      values.push([h.id, Math.round((ba.faceTotal * price) / 100)]);
    } else {
      const p = raw ? parseMoney(raw) : null;
      if (raw && p === null) { bad = `That value does not look right: ${raw}`; break; }
      values.push([h.id, p]);
    }
  }
  if (bad) { const el = document.getElementById("hverr"); if (el) el.textContent = bad; return; }
  for (const [hid, paise] of values) await store.updateHoldingValue(hid, paise);

async function fetchIfscDetails(raw) {
  const code = String(raw || "").trim().toUpperCase();
  if (!/^[A-Z]{4}0[A-Z0-9]{6}$/.test(code)) throw new Error("bad IFSC");
  try {
    const cached = JSON.parse(localStorage.getItem("bp.ifsc." + code) || "null");
    if (cached) return cached;
  } catch (e) {}
  if (!navigator.onLine) throw new Error("offline");
  const res = await fetch("https://ifsc.razorpay.com/" + encodeURIComponent(code),
    { signal: AbortSignal.timeout(8000) });
  if (!res.ok) throw new Error("not found");
  const d = await res.json();
  localStorage.setItem("bp.ifsc." + code, JSON.stringify(d));
  return d;
}

window.bpIfscLookup = async (overwrite = false) => {
  const msg = (t, bad) => { const el = document.getElementById("ifscmsg");
    if (el) { el.textContent = t; el.style.color = bad ? "var(--red)" : "var(--muted)"; } };
  const raw = (document.getElementById("s-ifsc")?.value || "").trim().toUpperCase();
  if (!/^[A-Z]{4}0[A-Z0-9]{6}$/.test(raw)) {
    msg("IFSC should be 11 characters, like HDFC0001234.", true); return;
  }
  const overwriteBtn = document.getElementById("ifsc-overwrite");
  const fill = (d) => {
    let filled = 0, kept = 0;
    const set = (id, v) => {
      const el = document.getElementById(id);
      if (!el || !v) return;
      if (!overwrite && el.value.trim()) { kept++; return; }
      el.value = v; filled++;
    };
    set("s-inst", d.BANK);
    set("s-branch", d.BRANCH);
    set("s-city", d.CITY || d.DISTRICT);
    set("s-state", d.STATE);
    set("s-address", d.ADDRESS);
    if (overwriteBtn) overwriteBtn.style.display = !overwrite && kept ? "" : "none";
    msg(`${overwrite ? "Used the IFSC values for" : "Fetched"} ${d.BANK || "the bank"}: `
      + `${filled} field${filled === 1 ? "" : "s"} filled`
      + (kept ? `, ${kept} existing kept` : "")
      + (kept && !overwrite ? " — edit any field, or use the IFSC values."
        : " — edit any field to override.")
      + " Account holder and balance are not available from IFSC.");
  };
  msg("Looking up the IFSC…");
  try {
    fill(await fetchIfscDetails(raw));
    // Once the branch details are there, show them read-only: five boxes that
    // look empty invite typing a second copy of what the IFSC already knows.
    window.bpIfscDerived?.(true);
  } catch (e) {
    if (overwriteBtn) overwriteBtn.style.display = "none";
    msg(e.message === "offline"
      ? "Offline. Type the bank, branch, city and address by hand; the app still works."
      : "Lookup failed. Check the connection or type the details by hand.", true);
  }
};

async function renderRealUpcoming(host) {
  try {
    const store = await import("./db.js");
    const assets = await store.listAccounts();
    const today = new Date().toISOString().slice(0, 10);
    const shift = (n) => {
      const d = new Date(today + "T00:00:00Z");
      d.setUTCDate(d.getUTCDate() + n);
      return d.toISOString().slice(0, 10);
    };
    const items = assets.filter((a) => a.maturity_date).map((a) => {
      const cat = categoryOf(a);
      const m = assetMetrics(a, cat);
      const value = cat === "insurance"
        ? (m.cover !== null ? m.cover : m.premium)
        : (m.expectedAtMaturity !== null ? m.expectedAtMaturity : m.value);
      const days = Math.ceil((Date.parse(a.maturity_date) - Date.parse(today)) / 86400000);
      return { a, cat, m, value, date: a.maturity_date, days };
    }).sort((x, y) => String(x.date).localeCompare(String(y.date)));
    if (!items.length) {
      host.innerHTML = `<h1>Upcoming</h1>
        <div class="card pad"><b>No dates recorded.</b>
        <p class="muted" style="font-size:13px">Add a maturity date to an FD, bond or policy
        and it appears here.</p>
        <button class="btn" onclick="go('assets')">Manage assets</button></div>`;
      return;
    }
    const upcoming = items.filter((x) => x.days >= 0);
    const matured = items.filter((x) => x.days < 0).sort((x, y) => y.date.localeCompare(x.date));
    const range = window.bpUpcomingRange || "all";
    const limit = range === "90" ? shift(90) : range === "365" ? shift(365) : null;
    const visible = range === "matured" ? matured
      : upcoming.filter((x) => !limit || x.date <= limit);
    const count90 = upcoming.filter((x) => x.date <= shift(90)).length;
    const count365 = upcoming.filter((x) => x.date <= shift(365)).length;
    const upcomingTotal = upcoming.reduce((t, x) => t + (x.value || 0), 0);
    const lead = upcoming[0] || null;
    const when = (x) => x.days < 0 ? `${-x.days} days ago` : x.days === 0 ? "today"
      : x.days === 1 ? "tomorrow" : `in ${x.days} days`;
    const catDot = (cat) => cat === "bonds" ? "var(--blue)" : cat === "insurance"
      ? "var(--amber)" : cat === "fd" ? "var(--green)" : "var(--s4)";

    const groups = [];
    for (const x of visible) {
      const key = x.date.slice(0, 7);
      let g = groups.find((y) => y.key === key);
      if (!g) { g = { key, items: [], total: 0 }; groups.push(g); }
      g.items.push(x);
      g.total += x.value || 0;
    }
    const monthName = (key) => new Date(key + "-01T00:00:00Z")
      .toLocaleString("en-IN", { month: "long", year: "numeric", timeZone: "UTC" });
    const rowsFor = (g) => `<h2 style="display:flex;justify-content:space-between;
      align-items:baseline;gap:12px;margin:18px 0 6px">${monthName(g.key)}
      <span class="muted" style="font-size:12px;font-weight:400">${money(g.total)}</span></h2>
      <div class="card"><div class="timeline">${g.items.map((x) => {
        const d = new Date(x.date + "T00:00:00Z");
        const mon = d.toLocaleString("en-IN", { month: "short", timeZone: "UTC" }).toUpperCase();
        const label = x.cat === "insurance" ? "policy amount" : "at maturity";
        return `<a class="tl-row" href="#" onclick="${assetOpen(x.a)};return false">
          <div class="tl-rail"><span class="tl-dot" style="background:${catDot(x.cat)}"></span></div>
          <div class="tl-date"><span class="m">${mon}</span>
            <span class="d">${x.date.slice(8, 10)}</span><span class="y">${x.date.slice(0, 4)}</span></div>
          <div class="tl-main"><div class="nm">${esc(x.a.label || x.a.bank || x.a.id)}</div>
            <div class="sub">${categoryLabel(x.cat)} · ${when(x)}</div></div>
          <div class="tl-amt">${x.value === null ? "—" : money(x.value)}
            <div class="sub" style="font-size:11px;color:var(--muted);font-weight:400">${label}</div></div>
        </a>`;
      }).join("")}</div></div>`;
    const body = groups.length ? groups.map(rowsFor).join("")
      : `<div class="card pad" style="margin-top:14px">Nothing in this window.
        <button class="btn" style="margin-left:8px" onclick="bpUpcomingSet('all')">Show all</button></div>`;

    const chip = (key, label) => {
      const on = range === key;
      return `<button class="btn" onclick="bpUpcomingSet('${key}')" style="${on
        ? "border-color:var(--green);color:var(--green);font-weight:640" : ""}">${label}</button>`;
    };
    host.innerHTML = `<h1>Upcoming</h1>
      <div class="hero"><div class="lbl">${lead ? "Next maturity" : "Nothing ahead"}</div>
        <div class="num">${lead ? money(lead.value) : "—"}</div>
        <div class="chips"><span>${upcoming.length} ahead</span>
          <span>${money(upcomingTotal)} expected</span>
          <span>${count90} in 90 days</span></div>
        <div style="font-size:12px;margin-top:10px;color:rgba(255,255,255,.78)">
          ${lead ? `${esc(lead.a.label || lead.a.bank || lead.a.id)} · ${dateLabel(lead.date)} · ${when(lead)}`
            : "Every recorded maturity has already passed. The history is below."}</div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin:14px 0">
        ${chip("all", `All ahead (${upcoming.length})`)}
        ${chip("90", `Next 90 days (${count90})`)}
        ${chip("365", `Next 12 months (${count365})`)}
        ${chip("matured", `Matured (${matured.length})`)}
      </div>
      ${body}
      <div class="muted" style="font-size:11.5px;margin-top:14px;line-height:1.5">
        FDs and bonds show the amount expected at maturity. Insurance shows the policy
        amount; net worth counts premiums paid, not the policy amount.</div>`;
  } catch (e) {
    if (/locked/i.test(String(e.message || e))) {
      host.innerHTML = lockedCard("Upcoming");
      return;
    }
    host.innerHTML = `<h1>Upcoming</h1><div class="card pad">storage error: ${esc(e.message)}</div>`;
  }
}

  if (mode === "real") {
    const ok = await ensureUnlocked();
    if (!ok) return;
  }
  go(views[v] ? v : "home");
})
  .catch(e => { document.getElementById("view").innerHTML =
    `<div class="card pad">Could not load data.json (${e}).</div>`; });

const MONEY_RE = /(?:₹|Rs\.?|\$)\s?-?[\d,]+(?:\.\d+)?(?:\s?(?:Cr|L|K))?/g;
function bpWrapMoney(root) {
  if (!root) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      if (!node.nodeValue || node.nodeValue.indexOf("₹") === -1) return NodeFilter.FILTER_REJECT;
      const parent = node.parentElement;
      if (!parent) return NodeFilter.FILTER_REJECT;
      if (parent.closest(".bp-money, button, input, textarea, select, option, script, style")) {
        return NodeFilter.FILTER_REJECT;
      }
      return NodeFilter.FILTER_ACCEPT;
    },
  });
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const node of nodes) {
    const text = node.nodeValue;
    const parts = [];
    let last = 0, match;
    MONEY_RE.lastIndex = 0;
    while ((match = MONEY_RE.exec(text)) !== null) {
      if (match.index > last) parts.push(document.createTextNode(text.slice(last, match.index)));
      const span = document.createElement("span");
      span.className = "bp-money";
      span.textContent = match[0];
      parts.push(span);
      last = match.index + match[0].length;
    }
    if (!parts.length) continue;
    if (last < text.length) parts.push(document.createTextNode(text.slice(last)));
    const frag = document.createDocumentFragment();
    for (const part of parts) frag.appendChild(part);
    node.parentNode.replaceChild(frag, node);
  }
}
function bpWrapSensitive(root) {
  if (!root) return;
  const re = /(?:\b[A-Z]{2}[A-Z0-9]{9}\d\b|\b[A-Z]{4}0[A-Z0-9]{6}\b|\b[A-Z]{5}\d{4}[A-Z]\b|\b\d{4}(?:[ -]?\d{4}){3}\b|\b(?=[A-Z0-9]{10,24}\b)(?=[A-Z0-9]*\d{6,})[A-Z0-9]+\b|\b\d{7,18}\b)/g;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      const value = node.nodeValue;
      if (!value || !/\d/.test(value)) return NodeFilter.FILTER_REJECT;
      const parent = node.parentElement;
      if (!parent) return NodeFilter.FILTER_REJECT;
      if (parent.closest(".bp-money, .bp-sensitive, button, input, textarea, select, option, script, style")) {
        return NodeFilter.FILTER_REJECT;
      }
      return NodeFilter.FILTER_ACCEPT;
    },
  });
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const node of nodes) {
    const text = node.nodeValue;
    const parts = [];
    let last = 0, match;
    re.lastIndex = 0;
    while ((match = re.exec(text)) !== null) {
      if (match.index > last) parts.push(document.createTextNode(text.slice(last, match.index)));
      const span = document.createElement("span");
      span.className = "bp-sensitive";
      span.textContent = match[0];
      parts.push(span);
      last = match.index + match[0].length;
    }
    if (!parts.length) continue;
    if (last < text.length) parts.push(document.createTextNode(text.slice(last)));
    const frag = document.createDocumentFragment();
    for (const part of parts) frag.appendChild(part);
    node.parentNode.replaceChild(frag, node);
  }
}
function bpApplyPrivacy() {
  const on = localStorage.getItem("bp.privacy") === "1";
  document.body.classList.toggle("bp-privacy", on);
  const btn = document.getElementById("privacy-toggle");
  if (btn) {
    btn.textContent = on ? "🙈" : "👁";
    btn.title = on ? "Show amounts" : "Hide amounts";
    btn.setAttribute("aria-label", btn.title);
    btn.setAttribute("aria-pressed", on ? "true" : "false");
  }
}
window.bpTogglePrivacy = () => {
  localStorage.setItem("bp.privacy", localStorage.getItem("bp.privacy") === "1" ? "0" : "1");
  bpApplyPrivacy();
};
function bpStartPrivacyObserver() {
  const view = document.getElementById("view");
  if (!view) return;
  bpWrapMoney(view);
  bpWrapSensitive(view);
  let scheduled = false, wrapping = false;
  const obs = new MutationObserver(() => {
    if (scheduled || wrapping) return;
    scheduled = true;
    requestAnimationFrame(() => {
      scheduled = false;
      wrapping = true;
      bpWrapMoney(view);
      bpWrapSensitive(view);
      wrapping = false;
    });
  });
  obs.observe(view, { childList: true, subtree: true });
}
bpApplyPrivacy();
bpStartPrivacyObserver();
</script>
