<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6b4f">
<title>BankPipe</title>
<script>
// Runs before the first paint, so a chosen theme never flashes the other one.
try {
  var th = localStorage.getItem("bp.theme");
  if (th === "light" || th === "dark") document.documentElement.dataset.theme = th;
} catch (e) {}
</script>
<style>
:root{--bg:#f5f3ee;--card:#fff;--ink:#0f1216;--muted:#6d6960;--line:#e9e5dc;
 --hair:#f0ece4;--green:#0b6b4f;--amber:#9a5b12;--red:#a32b22;--blue:#24597f;
 --r:16px;--sh:0 1px 2px rgba(15,18,22,.05),0 12px 30px -18px rgba(15,18,22,.25);
 --s1:#0b6b4f;--s2:#24597f;--s3:#9a5b12;--s4:#7a5c9e;--s5:#a32b22;--gold:#a8801f;
 color-scheme:light}
/* A manual choice wins over the system one. The palette appears twice on
   purpose: once for "the system is dark and you have not overridden it", once
   for "you chose dark". Keep the two blocks in step. */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0d0f;
 --card:#15171a;--ink:#f2f0ec;--muted:#9b968d;--line:#24262a;--hair:#1d1f23;
 --green:#4fbb90;--amber:#e0a763;--red:#e08d86;--blue:#8fb8df;--sh:none;
 --s1:#4fbb90;--s2:#8fb8df;--s3:#e0a763;--s4:#b9a0d8;--s5:#e08d86;--gold:#e6c15a;
 color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c0d0f;--card:#15171a;--ink:#f2f0ec;--muted:#9b968d;
 --line:#24262a;--hair:#1d1f23;--green:#4fbb90;--amber:#e0a763;--red:#e08d86;
 --blue:#8fb8df;--sh:none;--s1:#4fbb90;--s2:#8fb8df;--s3:#e0a763;--s4:#b9a0d8;
 --s5:#e08d86;--gold:#e6c15a;color-scheme:dark}
:root[data-theme="light"]{--bg:#f5f3ee;--card:#fff;--ink:#0f1216;--muted:#6d6960;
 --line:#e9e5dc;--hair:#f0ece4;--green:#0b6b4f;--amber:#9a5b12;--red:#a32b22;
 --blue:#24597f;--s1:#0b6b4f;--s2:#24597f;--s3:#9a5b12;--s4:#7a5c9e;--s5:#a32b22;
 --gold:#a8801f;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
 font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
 -webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1040px;margin:0 auto;display:flex;gap:8px;align-items:center;padding:10px 18px}
.backbtn{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--card);
 color:var(--ink);font-size:19px;line-height:1;display:grid;place-items:center;cursor:pointer;
 flex-shrink:0;padding:0 0 2px}
.backbtn:hover:not(:disabled){border-color:var(--green);color:var(--green)}
.backbtn:disabled{opacity:.35;cursor:default}
.mark{width:24px;height:24px;border-radius:8px;background:linear-gradient(140deg,#0a5741,#12a077);
 color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.brand{font-weight:640;letter-spacing:-.01em}
.navwrap{display:flex;align-items:center;gap:2px;min-width:0;flex:1;justify-content:flex-end}
nav{margin-left:auto;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;
 -webkit-overflow-scrolling:touch}
.navwrap nav{margin-left:0}
.navwrap::-webkit-scrollbar,nav::-webkit-scrollbar{display:none}
.navarrow{display:none;width:21px;height:21px;border-radius:50%;border:1px solid var(--line);
 background:var(--card);color:var(--muted);font-size:13px;line-height:1;padding:0 0 1px;
 cursor:pointer;flex-shrink:0}
.navarrow:hover{color:var(--ink);border-color:var(--muted)}
.navwrap.overflowing .navarrow{display:grid;place-items:center}
.navwrap.at-start #nav-left,.navwrap.at-end #nav-right{visibility:hidden}
nav button{border:0;background:none;font:inherit;font-size:13.5px;color:var(--muted);
 padding:7px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
nav button[aria-current="page"]{background:var(--card);color:var(--ink);font-weight:620;
 box-shadow:0 1px 2px rgba(0,0,0,.06)}
.wrap{max-width:1040px;margin:0 auto;padding:24px 18px 80px}
h1{font-size:24px;letter-spacing:-.02em;margin:0 0 16px}
h2{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
 margin:26px 0 10px;font-weight:680}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
 box-shadow:var(--sh)}
.pad{padding:18px 20px}
.hero{border:0;color:#fff;padding:26px 28px;border-radius:var(--r);
 background:linear-gradient(135deg,#084b39,#0c6b50 48%,#0f8a68)}
.hero .lbl{font-size:12.5px;color:rgba(255,255,255,.75)}
.hero .num{font-size:42px;font-weight:660;letter-spacing:-.035em;font-variant-numeric:tabular-nums;
 margin:6px 0 10px;white-space:nowrap}
.hero .chips{display:flex;gap:8px;flex-wrap:wrap}
.hero-split{margin-top:12px;max-width:540px}
.hero-bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.14)}
.hero-bar span{display:block;height:100%}
.hero-split .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:12px;
 color:rgba(255,255,255,.82)}
.hero-split .legend span{display:inline-flex;align-items:center;gap:0}
.hero-split .legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.hero-split .legend b{color:#fff;font-weight:640;margin-left:5px}
.hero .chips span{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.15);
 padding:6px 11px;border-radius:999px;font-size:12.5px}
.srow{display:grid;grid-template-columns:30px minmax(0,1fr) 150px 44px;gap:12px;
 align-items:center;padding:12px 14px;border-top:1px solid var(--hair);
 color:inherit;text-decoration:none}
a.srow:hover{background:rgba(15,18,22,.03)}
a.link{color:inherit;text-decoration:none;border-bottom:1px solid var(--line);
  padding-bottom:1px}
a.link:hover{border-bottom-color:var(--green);color:var(--green)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
 border:1px solid var(--line);background:var(--card);color:var(--ink);
 font:inherit;font-size:13.5px;font-weight:620;padding:9px 14px;border-radius:9px;
 cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--green);color:var(--green)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{color:#fff;border-color:var(--green);
 background:color-mix(in srgb,var(--green) 88%,#000)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--hair);border-color:transparent}
.acct-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;
 flex-wrap:wrap;margin:14px 0}
.acct-actions-main,.acct-actions-side{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fact-edit td{background:var(--hair);padding:10px 12px}
.fe-grid{display:grid;grid-template-columns:140px minmax(0,1fr) 130px 140px auto;gap:8px;
 align-items:end}
.fe-cell{display:flex;flex-direction:column;gap:3px;min-width:0}
.fe-cell span{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fe-cell .inline-input{width:100%;min-width:0}
.fe-actions{display:flex;gap:6px;align-items:center;white-space:nowrap}
.mini-btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 35%,transparent)}
@media (max-width:760px){.fe-grid{grid-template-columns:1fr 1fr}.fe-cell:nth-child(2){grid-column:span 2}}
tr.row-break td{background:color-mix(in srgb,var(--amber) 9%,transparent)}
tr.row-break td:first-child{box-shadow:inset 3px 0 0 var(--amber)}
.break-flag{font-size:9.5px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;
 color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 35%,transparent);
 border-radius:99px;padding:1px 6px;margin-left:4px;white-space:nowrap}
.break-expected{font-size:11px;color:var(--amber);font-variant-numeric:tabular-nums}
.break-dup{font-size:10.5px;color:var(--muted);margin-top:2px}
.checkline{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.checkline input{width:16px;height:16px}
.dup-group{border-top:1px solid var(--hair);padding:10px 0}
.dup-group:first-of-type{border-top:0}
.dup-title{font-size:13px;font-weight:620;margin-bottom:2px}
.dup-row{display:grid;grid-template-columns:120px 1fr auto;gap:10px;font-size:12.5px;
 padding:2px 0;color:var(--muted);align-items:center}
.dup-row b{color:var(--ink);font-weight:600}
.dup-tag{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;border-radius:99px;
 padding:1px 7px;border:1px solid var(--line)}
.dup-tag.keep{color:var(--green);border-color:color-mix(in srgb,var(--green) 35%,transparent)}
.dup-tag.drop{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 35%,transparent)}
.btn:disabled{opacity:.55;cursor:default}
input[type=file]{font-size:13px;color:var(--muted);max-width:100%}
input[type=file]::file-selector-button{font:inherit;font-size:13px;font-weight:620;
 border:1px solid var(--line);background:var(--card);color:var(--ink);
 padding:7px 12px;border-radius:9px;margin-right:10px;cursor:pointer}
input[type=file]::file-selector-button:hover{border-color:var(--green);color:var(--green)}
label.field{display:grid;gap:5px;font-size:12.5px;color:var(--muted)}
label.field input,label.field select,label.field textarea{font:inherit;font-size:14px;color:var(--ink);
 background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px 12px;width:100%}
label.field input:focus,label.field select:focus,label.field textarea:focus{outline:2px solid var(--green);outline-offset:1px}
label.field textarea{resize:vertical;min-height:58px}
.form{display:grid;gap:12px;max-width:460px}
@media (min-width:720px){.form{grid-template-columns:1fr 1fr;max-width:760px}}
.form .wide{grid-column:1/-1}
.subform{display:grid;gap:12px}
@media (min-width:720px){.subform{grid-template-columns:1fr 1fr}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}
.stats .k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
 font-weight:650}
.stats .v{font-size:19px;font-weight:660;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stats .v.pos{color:var(--green)}.stats .v.neg{color:var(--red)}
.bar-row{display:grid;grid-template-columns:110px 1fr 120px;gap:12px;align-items:center;
 padding:7px 0;font-size:13px}
.bar-track{height:7px;background:var(--hair);border-radius:99px;overflow:hidden;display:flex}
.bar-fill{height:100%;background:var(--green);border-radius:99px}
.bar-val{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.bar-seg{height:100%}
.bar-legend{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 8px 122px;font-size:11.5px;color:var(--muted)}
.bar-legend span{cursor:pointer}
.bar-legend.static span{cursor:default}
.bar-legend i{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:5px;vertical-align:1px}
@media (max-width:600px){.bar-legend{margin-left:90px}}
.kv-group{background:var(--hair);border-left:3px solid var(--blue);border-radius:0 10px 10px 0;padding:8px 10px 10px 12px;margin:8px 0}
.kv-group .kv{gap:6px}
.kv-group-label{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:680;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.ifsc-tag{display:inline-block;padding:1px 5px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--blue);font-size:9px;font-weight:700;letter-spacing:.04em}
.bank-group{display:block}
.bank-subs{margin:-2px 0 6px 40px;border-left:1px solid var(--line);padding-left:10px;padding-right:14px;width:calc(100% - 40px);box-sizing:border-box}
.bank-subs.acct-list{margin-left:14px;padding-left:8px;width:calc(100% - 14px)}
.fd-subs{margin:0 0 4px 14px;border-left:1px dashed var(--line);padding-left:8px;padding-right:14px;width:calc(100% - 14px);box-sizing:border-box}
.fd-sub{font-size:11.5px;color:var(--muted)}
.fd-sub .amt{font-size:11.5px}
.fd-history{margin-top:6px;border-top:1px solid var(--hair)}
.fd-history summary{cursor:pointer;font-size:12px;color:var(--muted);padding:9px 0;
  user-select:none}
.fd-history summary:hover{color:var(--ink)}
.acct-sub{min-width:0}
.subrow{display:grid;grid-template-columns:minmax(0,1fr) auto 18px;gap:8px;align-items:center;padding:5px 0;text-decoration:none;color:inherit;font-size:12.5px;width:100%;box-sizing:border-box}
.subrow + .subrow{border-top:1px solid var(--hair)}
.subrow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subrow .amt{font-variant-numeric:tabular-nums;text-align:right}
.subrow .pc{color:var(--muted);text-align:right}
.unlinked-fds summary{list-style:none}
.unlinked-fds summary::-webkit-details-marker{display:none}
.acct-sections{margin:0 0 4px 14px;border-left:1px dashed var(--line);padding-left:8px;padding-right:14px;box-sizing:border-box}
.acct-sections.in-bank{margin-left:0;border-left:0;padding-left:0;padding-right:0}
.acct-bank-row{padding-left:28px}
.acct-bank-row .nm{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.35}
.acct-sec + .acct-sec{border-top:1px solid var(--hair)}
.acct-sec-head{display:grid;grid-template-columns:28px minmax(0,1fr);gap:2px;align-items:center}
.acct-sec-head.no-toggle{grid-template-columns:28px minmax(0,1fr)}
.acct-sec-spacer{display:block;width:28px;height:1px}
.acct-sec-toggle{width:28px;height:28px;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:8px;display:grid;place-items:center;font-size:11px;line-height:1;flex-shrink:0}
.acct-sec-toggle:hover{background:var(--hair);color:var(--ink)}
.acct-sec-toggle span{display:block;transition:transform .15s}
.acct-sec-toggle[aria-expanded="false"] span{transform:rotate(-90deg)}
.acct-sec-body{padding:0 0 6px 28px}
.acct-sec-body[hidden]{display:none}
.acct-sec-body .subrow{font-size:12px}
.acct-sec-empty{padding:2px 0 6px;line-height:1.45;font-size:12px}
.donut{width:190px;height:190px;border-radius:50%;position:relative;display:grid;place-items:center;flex-shrink:0;box-shadow:inset 0 0 0 1px var(--line);transition:filter .15s ease}
.donut:hover{filter:brightness(1.04)}
.donut-hole{width:122px;height:122px;border-radius:50%;background:var(--card);display:grid;place-content:center;text-align:center;padding:8px}
.donut-hole .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.donut-hole .v{font-size:16px;font-weight:660;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.donut-legend{display:grid;gap:6px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
.legend-row{display:grid;grid-template-columns:10px minmax(0,1fr) auto 38px;gap:8px;align-items:center;text-decoration:none;color:inherit;font-size:12.5px}
.legend-row .dot{width:9px;height:9px;border-radius:99px}
.legend-row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend-row .amt{font-variant-numeric:tabular-nums;text-align:right}
.legend-row .pct{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.legend-row:hover .nm{text-decoration:underline;text-underline-offset:2px}
.alloc-sub{display:grid;gap:3px;margin:1px 0 5px 18px}
.alloc-sub a{display:grid;grid-template-columns:7px minmax(0,1fr) auto;gap:7px;align-items:center;
  text-decoration:none;color:var(--muted);font-size:11.5px}
.alloc-sub a:hover{color:var(--ink)}
.alloc-sub i{width:7px;height:7px;border-radius:99px}
.alloc-sub a span{font-variant-numeric:tabular-nums}
.alloc-sub a span:first-of-type{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alloc-sub a span:last-child{text-align:right}
.sortbar{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:8px}
.stat-chips{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0 2px}
.stat-chip{border:1px solid var(--line);border-radius:99px;padding:3px 8px;font-size:11px;color:var(--muted);background:var(--card);white-space:nowrap}
.stat-chip b{color:var(--ink);font-weight:620}
.flow-top{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.flow-top .k,.flow-net .k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
 color:var(--muted);font-weight:650}
.flow-top .v{font-size:16px;font-weight:660;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.flow-top .v.pos{color:var(--green)}.flow-top .v.neg{color:var(--red)}
.flow-net{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
 border-top:1px solid var(--hair);margin-top:8px;padding-top:6px}
.flow-net .v{font-size:17px;font-weight:660;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.flow-net .v.pos{color:var(--green)}.flow-net .v.neg{color:var(--red)}
.flow-list{margin:9px -4px 0;padding:2px 4px;max-height:236px;overflow-y:auto;overscroll-behavior:contain}
.flow-month{display:grid;grid-template-columns:72px minmax(0,1fr) 62px;gap:10px;align-items:center;
 width:100%;background:none;border:0;border-top:1px solid var(--hair);padding:7px 6px;
 font:inherit;color:inherit;cursor:pointer;text-align:left;border-radius:8px}

.flow-month:hover{background:rgba(15,18,22,.03)}

.flow-month .fm{font-size:12px;color:var(--muted);white-space:nowrap}
.flow-month.is-on .fm{color:var(--ink);font-weight:620}
.flow-month .fb{display:grid;gap:3px;align-content:center}
.flow-month .fb i{display:block;height:3px;border-radius:99px;background:var(--green)}
.flow-month .fb i.out{background:var(--red);opacity:.65}
.flow-month .fn{text-align:right;font-size:12px;font-variant-numeric:tabular-nums;font-weight:620}
.flow-month .fn.pos{color:var(--green)}
.flow-month .fn.neg{color:var(--red)}
.flow-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:7px}
.flow-foot .muted{font-size:11px}
.sortbar .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink);
  font-weight:680;margin-right:5px}
.sortbtn{appearance:none;border:1px solid transparent;background:none;font:inherit;font-size:12px;
  color:var(--muted);padding:5px 9px;border-radius:8px;cursor:pointer}
.sortbtn:hover{background:var(--hair);color:var(--ink)}
.sortbtn.on{background:var(--hair);border-color:var(--line);color:var(--ink);font-weight:620}
.sortbtn .ar{font-size:8.5px;margin-left:3px;color:var(--green)}
.fdrow .nm{white-space:normal;overflow:visible}

.fdrow .fdrow-sub{font-size:11px;color:var(--muted)}
.snap-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px;align-items:center;
  padding:9px 0;border-top:1px solid var(--hair)}
.snap-row:first-child{border-top:0}
.snap-date{font-size:12.5px}
.snap-meta{font-size:11px;color:var(--muted);margin-top:1px}
.hd-row{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:center;
  padding:7px 0;border-top:1px solid var(--hair);font-size:12.5px}
.hd-row:first-child{border-top:0}
.hd-row .sign{font-weight:700;text-align:center}
.hd-row.add .sign{color:var(--green)}
.hd-row.del .sign{color:var(--red)}
.hd-row.chg .sign{color:var(--amber)}
.hd-row .dt{font-size:11px;color:var(--muted)}
.hd-row .v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bond-line{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.4}

function wireResizableTables() {
  const view = document.getElementById("view");
  if (!view) return;
  view.querySelectorAll("table").forEach((table, index) => {
    if (table.dataset.resizableReady) return;
    table.dataset.resizableReady = "1";
    const heading = view.querySelector("h1")?.textContent || "table";
    const key = table.dataset.table || `${heading}-${index}`;
    const ths = [...table.querySelectorAll("tr:first-child th")];
    if (ths.length < 2) return;
    const lastIndex = ths.length - 1;
    const isPick = (th) => th.classList.contains("pick");
    // The description is the one column that absorbs fixed-layout slack, so
    // the tick column never turns into a gap before the date.
    const isFlex = (th, i) => table.dataset.table === "account" && i === 2;
    const fixedFor = (th, i) => {
      if (isPick(th)) return 34;
      if (i === lastIndex && table.dataset.table === "account") return 44;
      return null;
    };
    const minFor = (th) => {
      const t = (th.textContent || "").trim().toLowerCase();
      if (/description|security/.test(t)) return 180;
      if (/account/.test(t)) return 130;
      if (/amount|balance|value|cost|gain/.test(t)) return 96;
      if (/qty|date/.test(t)) return 84;
      return 72;
    };
    const pinWidth = (th, i) => {
      const fixed = fixedFor(th, i);
      if (fixed === null) return false;
      th.style.width = fixed + "px";
      th.style.minWidth = fixed + "px";
      th.style.maxWidth = fixed + "px";
      return true;
    };
    ths.forEach(pinWidth);
    const saved = (() => {
      try { return JSON.parse(localStorage.getItem("bp.cols.v3." + key) || "null"); }
      catch (e) { return null; }
    })();
    if (Array.isArray(saved) && saved.length === ths.length) {
      table.classList.add("resizable");
      ths.forEach((th, i) => {
        if (pinWidth(th, i)) return;
        if (isFlex(th, i)) {
          th.style.width = "auto";
          th.style.minWidth = Math.max(minFor(th), saved[i]) + "px";
          return;
        }
        th.style.width = Math.max(minFor(th), saved[i]) + "px";
      });
    }
    ths.forEach((th, i) => {
      // The tick column and the trailing actions column are controls, not
      // data, so they never get a drag handle.
      if (isPick(th) || i === lastIndex) return;
      const handle = document.createElement("div");
      handle.className = "col-resizer";
      handle.title = "Drag to resize; double-click to reset";
      handle.addEventListener("dblclick", () => {
        localStorage.removeItem("bp.cols.v3." + key);
        location.reload();
      });
      th.appendChild(handle);
      handle.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (!table.classList.contains("resizable")) {
          table.classList.add("resizable");
          ths.forEach((t, j) => {
            t.style.width = t.getBoundingClientRect().width + "px";
            if (isFlex(t, j)) t.style.minWidth = "0px";
          });
        }
        const startX = e.clientX, startW = th.getBoundingClientRect().width;
        try { handle.setPointerCapture(e.pointerId); } catch (err) {}
        const move = (ev) => {
          th.style.width = Math.max(minFor(th), startW + ev.clientX - startX) + "px";
        };
        const up = () => {
          handle.removeEventListener("pointermove", move);
          handle.removeEventListener("pointerup", up);
          try {
            localStorage.setItem("bp.cols.v3." + key,
              JSON.stringify(ths.map((t) => Math.round(t.getBoundingClientRect().width))));
          } catch (err) {}
        };
        handle.addEventListener("pointermove", move);
        handle.addEventListener("pointerup", up);
      });
    });
  });
}

function saveTxns(rows) {
  const seen = new Set(loadTxns().map(t => `${t.account}|${t.date}|${t.amount}|${t.balance}|${t.n}`));
  const merged = loadTxns(); let kept = 0, dup = 0;
  for (const r of rows) {
    let base = `${r.account}|${r.date}|${r.amount}|${r.balance}|`;
    let n = 1; while (seen.has(base + n)) n++;
    if (n > 1) dup++; else kept++;
    seen.add(base + n);
    merged.push({ ...r, n, key: base + n });
  }
  localStorage.setItem(KEY, JSON.stringify(merged));
  return { kept, dup };
}

function bpBatchBankOf(text) {
  const hay = String(text || "").toLowerCase();
  const hit = BP_BATCH_BANKS.find(([word]) => hay.includes(word));
  return hit ? hit[1] : "";
}

function bpBatchDigits(value) {
  return String(value || "").replace(/\D/g, "");
}

function bpBatchLast4(entry) {
  return bpBatchDigits(entry.number).slice(-4);
}

// The name offered for a new account. It is only a suggestion: the user can
// change it in the row before the import creates anything.
function bpBatchSuggestedName(entry) {
  const bank = entry.bank || "";
  const last4 = bpBatchLast4(entry);
  if (bank && last4) return `${bank} ${last4}`;
  if (bank) return bank;
  if (last4) return `Bank account ${last4}`;
  return String(entry.name || "Statement").replace(/\.[^.]+$/, "");
}

function bpBatchCreateName(entry) {
  const bank = entry.bank || "";
  const last4 = bpBatchLast4(entry);
  if (bank && last4) return `${bank} …${last4}`;
  if (bank) return bank;
  if (last4) return `Account …${last4}`;
  return String(entry.name || "account").replace(/\.[^.]+$/, "");
}

function bpBatchState() {
  if (!window.bpBatch || !Array.isArray(window.bpBatch.entries)) {
    window.bpBatch = { entries: [], nextId: 1, accounts: [], busy: false,
      preparing: false, prepareAgain: false };
  }
  return window.bpBatch;
}

function bpBatchClearUnlock() {
  const host = document.getElementById("bp-unlock-host");
  if (host) host.innerHTML = "";
}

function bpBatchDetected(entry) {
  const why = entry.guess?.why || "";
  const method = /account number/i.test(why) ? "account number"
    : /last four/i.test(why) ? "last four"
    : /bank name/i.test(why) ? "bank name"
    : "not found";
  return { method, number: entry.number || "", last4: bpBatchLast4(entry),
    bank: entry.bank || "" };
}

function bpBatchDetectedHtml(entry) {
  if (!entry.parsed && entry.status !== "done") return `<span class="muted">—</span>`;
  const detected = bpBatchDetected(entry);
  if (detected.method === "not found") {
    return `<span>not found</span>${detected.number
      ? `<div class="muted" style="font-size:11.5px">${esc(detected.number)}</div>` : ""}`;
  }
  const detail = detected.method === "account number" ? detected.number
    : detected.method === "last four" ? (detected.last4 ? `…${detected.last4}` : detected.number)
    : detected.bank || detected.number;
  return `<b>${esc(detected.method)}</b><div class="muted" style="font-size:11.5px">${esc(detail || "—")}${
    detected.bank && detected.method !== "bank name" ? ` · ${esc(detected.bank)}` : ""}</div>`;
}

function bpBatchFileNote(entry) {
  if (entry.duplicateOf) return "Same bytes as the earlier file; it is skipped by default.";
  if (entry.status === "locked") return "Locked by the bank. Unlock it to read the rows.";
  if (entry.pdf && entry.status !== "error") return entry.pdf.line || "";
  return "";
}

function bpBatchStatusHtml(entry) {
  if (entry.duplicateOf) {
    return `<span class="pill">Same file as #${entry.duplicateOf}</span>`;
  }
  if (entry.status === "queued" || entry.status === "preparing") {
    return `<span class="muted" style="font-size:12px">Reading…</span>`;
  }
  if (entry.status === "locked") {
    return `<span class="pill warn">Password needed</span>
      <div style="margin-top:6px"><button class="btn" style="padding:3px 9px;font-size:12px"
        onclick="bpBatchUnlock(${entry.id})">Unlock</button></div>`;
  }
  if (entry.status === "needs-account") {
    return `<span class="pill warn">Needs an account</span>`;
  }
  if (entry.status === "ready") return `<span class="pill ok">Ready</span>`;
  if (entry.status === "importing") return `<span class="pill warn">Importing…</span>`;
  if (entry.status === "done") {
    const result = entry.result || {};
    const counts = `${result.inserted || 0} new · ${result.duplicates || 0} already held · ${result.breaks || 0} breaks`;
    const extra = [
      result.corrected ? `${result.corrected} corrected` : "",
      result.browserOnly ? `browser only${result.dbError ? ` (${result.dbError})` : ""}` : "",
      result.closing && !result.closing.matches ? "closing balance differs" : "",
    ].filter(Boolean).join(" · ");
    return `<span class="pill ok">Imported</span>
      <div class="muted" style="font-size:11.5px;margin-top:3px">${esc(counts)}</div>
      ${extra ? `<div class="muted" style="font-size:11px;margin-top:2px">${esc(extra)}</div>` : ""}`;
  }
  return `<span class="pill bad">Error</span>
    <div class="muted" style="font-size:11.5px;margin-top:3px;color:var(--red)">${
      esc(entry.message || "This file could not be read.")}</div>`;
}

function bpBatchAccountOptions(entry, accounts) {
  const options = accounts.map((account) => {
    const label = accountLabel({ accountId: account.id }, accounts)
      || account.label || account.bank || account.id;
    return `<option value="${esc(account.id)}" ${
      account.id === entry.accountId ? "selected" : ""}>${esc(label)}</option>`;
  }).join("");
  const chooser = `<option value="" ${
    entry.accountId ? "" : "selected"}>Choose an account…</option>`;
  const create = `<option value="__new__" ${
    entry.accountId === "__new__" ? "selected" : ""}>${
    esc(`Create “${bpBatchCreateName(entry)}”`)}</option>`;
  return chooser + options + create;
}

function bpBatchRowHtml(entry, accounts) {
  const editable = ["ready", "needs-account"].includes(entry.status);
  const doneLabel = entry.status === "done"
    ? (accountLabel(entry, accounts) || entry.accountId || "") : "";
  let destination = `<span class="muted">—</span>`;
  if (editable) {
    destination = `<select class="mini-select" style="width:100%"
        onchange="bpBatchSetAccount(${entry.id}, this.value)">
        ${bpBatchAccountOptions(entry, accounts)}</select>`;
    if (entry.accountId === "__new__") {
      destination += `<input class="mini-select" style="width:100%;margin-top:6px"
        value="${esc(entry.createName || bpBatchSuggestedName(entry))}"
        placeholder="Name for the new account" aria-label="Name for the new account"
        oninput="bpBatchSetName(${entry.id}, this.value)">`;
    }
  } else if (doneLabel) {
    destination = `<b>${esc(doneLabel)}</b>`;
  }
  const note = bpBatchFileNote(entry);
  const busy = bpBatchState().busy ? " disabled" : "";
  return `<tr>
    <td><b>${esc(entry.name)}</b>${note
      ? `<div class="muted" style="font-size:11.5px;margin-top:3px">${esc(note)}</div>` : ""}</td>
    <td>${destination}</td>
    <td>${bpBatchDetectedHtml(entry)}</td>
    <td class="n">${entry.parsed ? entry.count : "—"}</td>
    <td>${bpBatchStatusHtml(entry)}</td>
    <td style="white-space:nowrap"><button class="btn" style="padding:3px 9px;font-size:12px"${busy}
      onclick="bpBatchRemove(${entry.id})">Remove</button></td>
  </tr>`;
}

function bpBatchRender() {
  const host = document.getElementById("bp-batch-queue");
  if (!host) return;
  const state = bpBatchState();
  if (!state.entries.length) { host.innerHTML = ""; return; }
  const ready = state.entries.filter((entry) =>
    entry.status === "ready" && !entry.duplicateOf).length;
  host.innerHTML = `<div style="overflow-x:auto">
    <table style="width:100%;min-width:760px" data-table="bank-batch">
      <tr><th>File</th><th>Destination</th><th>Detected</th><th class="n">Rows</th>
        <th>Status</th><th></th></tr>
      ${state.entries.map((entry) => bpBatchRowHtml(entry, state.accounts || [])).join("")}
    </table></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
      <button class="btn" id="bp-batch-import" onclick="bpBatchImport()"${
        ready && !state.busy ? "" : " disabled"}>Import ready files</button>
      <button class="btn" onclick="bpBatchClear()"${state.busy ? " disabled" : ""}>Clear queue</button>
    </div>`;
}

async function bpBatchAddFiles(files) {
  const state = bpBatchState();
  for (const file of files) {
    try {
      const buf = await file.arrayBuffer();
      const bytes = new Uint8Array(buf);
      const ext = (file.name.match(/\.([^.]+)$/) || [, ""])[1].toLowerCase();
      const sha256 = await sha256Hex(buf);
      state.entries.push({
        id: state.nextId++, name: file.name, bytes,
        meta: { ext, bytes: buf.byteLength, sha256 }, sha256,
        status: "queued", message: "", accountId: "", createName: "",
        count: 0, number: "", bank: "", parsed: null, pre: null, pdf: null,
        result: null,
      });
    } catch (e) {
      state.entries.push({
        id: state.nextId++, name: file.name, bytes: null,
        meta: { ext: "", bytes: 0, sha256: "" }, sha256: "",
        status: "error", message: `This file could not be read: ${String((e && e.message) || e)}`,
        accountId: "", createName: "", count: 0, number: "", bank: "",
        parsed: null, pre: null, pdf: null, result: null,
      });
    }
  }
  duplicateFile(state.entries);
  bpBatchRender();
  await bpBatchPrepareQueued();
}

async function bpBatchPrepareQueued() {
  const state = bpBatchState();
  if (state.preparing) { state.prepareAgain = true; return; }
  state.preparing = true;
  try {
    state.accounts = await bpBankKnownAccounts();
    for (;;) {
      const next = state.entries.find((entry) =>
        entry.status === "queued" && !entry.duplicateOf);
      if (!next) break;
      await bpBatchPrepare(next);
    }
  } finally {
    state.preparing = false;
    bpBatchRender();
    if (state.prepareAgain) {
      state.prepareAgain = false;
      bpBatchPrepareQueued();
    }
  }
}

async function bpBatchPrepare(entry) {
  entry.status = "preparing";
  entry.message = "";
  entry.result = null;
  bpBatchRender();
  try {
    const { isEncryptedOffice } = await import("./office-crypto.js");
    if (isEncryptedOffice(entry.bytes)) {
      entry.status = "locked";
      entry.message = "Locked by the bank. Unlock it to read the rows.";
      return;
    }
    if (/\.pdf$/i.test(entry.name)) {
      await bpBatchPreparePdf(entry);
      return;
    }
    bpBatchPrepareSheet(entry);
  } catch (e) {
    if (e && (e.cancelled || e.wrong)) {
      entry.status = "locked";
      entry.message = e.wrong
        ? "That password did not open this PDF. Unlock to try again."
        : "Password needed.";
    } else {
      entry.status = "error";
      entry.message = String((e && e.message) || e).slice(0, 180);
    }
  } finally {
    bpBatchRender();
  }
}

function bpBatchPrepareSheet(entry) {
  let rows;
  if (/\.(xlsx|xlsm|xls)$/i.test(entry.name)) {
    const wb = XLSX.read(entry.bytes, { type: "array" });
    rows = sheetRows(wb.Sheets[wb.SheetNames[0]]);
  } else {
    rows = rowsFromCsv(new TextDecoder().decode(entry.bytes));
  }
  const parsed = parseStatement(rows);
  entry.rows = rows;
  if (parsed.error) {
    entry.status = "error";
    entry.message = parsed.error;
    return;
  }
  entry.parsed = parsed;
  entry.pre = scanPreamble(rows, Math.max(0, (parsed.header || 1) - 1));
  const dated = parsed.rows.filter((row) => /^\d{4}-\d{2}-\d{2}$/.test(row.date)
    && row.amount !== null);
  const dates = dated.map((row) => row.date).sort();
  bpBatchFinishDetect(entry, {
    number: entry.pre.accountNumber,
    bank: bpBatchBankOf(entry.pre.text),
    closing: auditStatement(rows, parsed).closing,
    count: dated.length,
    first: dates[0] || "",
    last: dates[dates.length - 1] || "",
  });
}

async function bpBatchPreparePdf(entry) {
  const { extractPdf, pdfToStatement } = await import("./pdf-statement.js");
  const extracted = await extractPdf(entry.bytes, {
    onPassword: (attempt) => bpPdfPasswordPrompt(entry, attempt),
  });
  const statement = pdfToStatement(extracted.pages);
  const pages = extracted.numPages || 0;
  const blocks = statement.blockCount || 0;
  entry.pdf = {
    pages, blocks, warnings: statement.warnings || [], layout: "",
    line: `PDF text layer · ${pages} page${pages === 1 ? "" : "s"} · ${blocks} account block${blocks === 1 ? "" : "s"}`,
  };
  if (statement.scanned) {
    entry.status = "error";
    entry.message = "This PDF looks scanned or photographed. It has no text layer, and BankPipe has no OCR; the file was not read.";
    return;
  }
  const choice = choosePdfBlock(statement.accounts || []);
  if (choice.error) {
    entry.status = "error";
    entry.message = choice.error;
    return;
  }
  const block = choice.block;
  const dates = block.rows.map((row) => row.date).filter(Boolean).sort();
  const pre = { accountNumber: block.number || "",
    numbers: [block.number].filter(Boolean), ifsc: "", text: "" };
  const pageText = (extracted.pages || [])
    .map((page) => (page.items || []).map((item) => item.str).join(" ")).join(" ");
  entry.pdf.layout = block.layout || "";
  entry.parsed = { rows: block.rows, header: 1, order: block.order || "desc",
    mapping: [] };
  entry.pre = pre;
  bpBatchFinishDetect(entry, {
    number: block.number || "",
    bank: bpBatchBankOf(`${block.name || ""} ${pageText}`),
    closing: block.closing ?? null,
    count: block.rows.length,
    first: dates[0] || "",
    last: dates[dates.length - 1] || "",
  });
}

function bpBatchFinishDetect(entry, info) {
  entry.number = info.number || "";
  entry.bank = info.bank || "";
  entry.count = info.count || 0;
  entry.first = info.first || "";
  entry.last = info.last || "";
  entry.closing = info.closing === undefined ? null : info.closing;
  const state = bpBatchState();
  const accounts = state.accounts || [];
  entry.guess = guessAccount(entry.pre || { numbers: [], text: "" }, accounts);
  if (!entry.accountId) {
    const matched = entry.guess
      ? accounts.find((account) => account.id === entry.guess.id) : null;
    const target = window.bpImportTarget
      ? accounts.find((account) => account.id === window.bpImportTarget) : null;
    entry.accountId = matched ? matched.id : target ? target.id : "";
    entry.createName = bpBatchSuggestedName(entry);
  }
  if (entry.accountId && entry.accountId !== "__new__"
      && !accounts.some((account) => account.id === entry.accountId)) {
    entry.accountId = "";
  }
  entry.status = entry.accountId ? "ready" : "needs-account";
}

// Banks often lock the workbook or PDF with a password (PAN, date of birth,
// customer id). Ask for it here, open the file on this device, and never store
// it. For a PDF the answer is handed back to pdf.js as a promise; the input is
// cleared before the value leaves this function.
function bpPdfPasswordPrompt(entry, attempt) {
  return new Promise((resolve, reject) => {
    window.bpLockedFile = { kind: "pdf", entry, name: entry.name, resolve, reject,
      wrong: Boolean(attempt && attempt.wrong) };
    entry.status = "locked";
    entry.message = "Password needed.";
    bpBatchRender();
    bpShowUnlock();
  });
}

function bpShowUnlock() {
  const locked = window.bpLockedFile;
  const host = document.getElementById("bp-unlock-host") || document.getElementById("res");
  if (!locked || !host) return;
  const pdf = locked.kind === "pdf";
  host.innerHTML = `<div class="card pad" style="border-color:var(--amber);margin-top:12px">
    <b>This file is locked</b>
    <p class="muted" style="font-size:13px;margin:6px 0 0">
      ${esc(locked.name)} was protected by the bank with a password. Type that password to open it.
      It is usually your PAN, date of birth, or customer ID — not your BankPipe passphrase.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px">
      <input id="bp-file-pw" type="password" autocomplete="off" spellcheck="false"
        placeholder="File password"
        style="flex:1;min-width:180px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font:inherit;background:var(--bg);color:var(--ink)"
        onkeydown="if(event.key==='Enter')bpUnlockFile()">
      <button class="btn" id="bp-unlock-btn" onclick="bpUnlockFile()">Unlock</button>
      <button class="btn" onclick="bpUnlockCancel()">Cancel</button>
    </div>
    <div id="bp-unlock-msg" class="muted" style="font-size:12.5px;margin-top:8px">${
      locked.wrong
        ? `<span style="color:var(--red)">That password did not open the ${pdf ? "PDF" : "file"}. Check the
           password the bank sent and try again. One more try is allowed.</span>`
        : ""}</div>
    <div class="muted" style="font-size:11.5px;margin-top:8px">The password is used here and
    nowhere else. It is not saved, and the file never leaves this device.</div>
  </div>`;
  const input = document.getElementById("bp-file-pw");
  if (input) { input.focus(); if (locked.wrong) input.select(); }
}

async function bpBatchPrepareBytes(entry, bytes) {
  entry.bytes = bytes;
  entry.meta = { ...(entry.meta || {}), bytes: bytes.byteLength };
  await bpBatchPrepare(entry);
}

window.bpUnlockFile = async () => {
  const locked = window.bpLockedFile;
  if (!locked) return;
  const input = document.getElementById("bp-file-pw");
  const msg = document.getElementById("bp-unlock-msg");
  const btn = document.getElementById("bp-unlock-btn");
  const password = input ? input.value : "";
  if (!password) {
    if (msg) msg.textContent = "Type the file password first.";
    return;
  }
  // The PDF reader owns the retry. Hand back the value and clear the field, so
  // the password is never left in the DOM or in window.bpLockedFile.
  if (locked.kind === "pdf") {
    const resolve = locked.resolve;
    window.bpLockedFile = null;
    if (input) input.value = "";
    bpBatchClearUnlock();
    if (resolve) resolve(password);
    return;
  }
  if (btn) { btn.disabled = true; btn.textContent = "Opening…"; }
  if (msg) msg.textContent = "";
  try {
    const { decryptOffice } = await import("./office-crypto.js");
    const bytes = await decryptOffice(locked.bytes, password);
    const entry = locked.entry;
    window.bpLockedFile = null;
    bpBatchClearUnlock();
    if (entry) await bpBatchPrepareBytes(entry, bytes);
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = "Unlock"; }
    const wrong = /wrong password/i.test(String(e && e.message));
    if (msg) {
      msg.innerHTML = wrong
        ? `<span style="color:var(--red)">That password did not open the file. Check the
           password the bank sent and try again.</span>`
        : `<span style="color:var(--red)">This file could not be opened:
           ${esc(String((e && e.message) || e))}</span>`;
    }
    if (input) { input.focus(); input.select(); }
  }
};

window.bpUnlockCancel = () => {
  const locked = window.bpLockedFile;
  window.bpLockedFile = null;
  bpBatchClearUnlock();
  if (locked && locked.reject) locked.reject(new Error("cancelled"));
  bpBatchRender();
};

function wireBankUpload() {
  const state = bpBatchState();
  const f = document.getElementById("f");
  if (f) {
    f.onchange = async () => {
      const files = [...(f.files || [])];
      f.value = "";
      if (files.length) await bpBatchAddFiles(files);
    };
  }
  bpBatchRender();
  if (window.bpLockedFile) bpShowUnlock();
  (async () => {
    state.accounts = await bpBankKnownAccounts();
    bpBatchRender();
    await bpBatchPrepareQueued();
  })();
}
window.bpImportClearTarget = () => { window.bpImportTarget = ""; go("import"); };

window.bpBatchUnlock = (id) => {
  const entry = bpBatchState().entries.find((item) => item.id === id);
  if (!entry) return;
  if (/\.pdf$/i.test(entry.name)) {
    if (!entry.bytes) return;
    bpBatchPrepare(entry);
    return;
  }
  window.bpLockedFile = { kind: "office", entry, name: entry.name,
    bytes: entry.bytes, meta: entry.meta };
  bpShowUnlock();
};

window.bpBatchRemove = (id) => {
  const state = bpBatchState();
  if (state.busy) return;
  state.entries = state.entries.filter((entry) => entry.id !== id);
  duplicateFile(state.entries);
  bpBatchRender();
  bpBatchPrepareQueued();
};

window.bpBatchClear = () => {
  const state = bpBatchState();
  if (state.busy) return;
  state.entries = [];
  state.prepareAgain = false;
  bpBatchClearUnlock();
  bpBatchRender();
};

window.bpBatchSetAccount = (id, value) => {
  const entry = bpBatchState().entries.find((item) => item.id === id);
  if (!entry) return;
  entry.accountId = value;
  if (value === "__new__" && !entry.createName) {
    entry.createName = bpBatchSuggestedName(entry);
  }
  entry.status = value ? "ready" : "needs-account";
  bpBatchRender();
};

window.bpBatchSetName = (id, value) => {
  const entry = bpBatchState().entries.find((item) => item.id === id);
  if (!entry) return;
  entry.createName = value;
};

async function bpBatchCreateAccount(entry) {
  const name = String(entry.createName || bpBatchSuggestedName(entry)).trim();
  if (!name) throw new Error("Type a name for the new account.");
  const store = await import("./db.js");
  const all = await store.listAccounts();
  const base = slug(name) || "bank-account";
  let id = base, n = 2;
  while (all.some((account) => account.id === id)) id = `${base}-${n++}`;
  const number = bpBatchDigits(entry.number);
  await store.createAccount({ id, label: name, bank: entry.bank || name, number,
    category: "bank", type: "savings", subtype: "savings" });
  const state = bpBatchState();
  if (!state.accounts.some((account) => account.id === id)) {
    state.accounts = [...state.accounts, { id, label: name, bank: entry.bank || name,
      number }];
  }
  entry.accountId = id;
  return id;
}

async function bpBatchImportOne(entry) {
  if (entry.accountId === "__new__") await bpBatchCreateAccount(entry);
  const account = entry.accountId;
  const incoming = chronological(entry.parsed).map((row) => ({ ...row, account }));
  const browser = saveTxns(incoming);
  let dbStats = null, dbError = "";
  try {
    const store = await import("./db.js");
    const timeout = (promise, ms, label) => Promise.race([promise, new Promise((_, reject) =>
      setTimeout(() => reject(new Error("timeout: " + label)), ms))]);
    await timeout(store.openDb(), 8000, "openDb");
    dbStats = await store.importRows(account, incoming,
      { closing: entry.closing ?? null });
  } catch (e) { dbError = String((e && e.message) || e).slice(0, 90); }
  entry.result = {
    inserted: dbStats ? dbStats.inserted : browser.kept,
    duplicates: dbStats ? dbStats.duplicates : browser.dup,
    corrected: dbStats ? dbStats.corrected || 0 : 0,
    breaks: dbStats ? dbStats.breaks || 0 : 0,
    closing: dbStats ? dbStats.closing || null : null,
    browserOnly: !dbStats,
    dbError,
  };
}

window.bpBatchImport = async () => {
  const state = bpBatchState();
  if (state.busy) return;
  const queue = state.entries.filter((entry) =>
    entry.status === "ready" && !entry.duplicateOf);
  if (!queue.length) return;
  state.busy = true;
  bpBatchRender();
  try {
    // Queue order, one file at a time. A failure is recorded on that row and
    // the next file still runs; importRows dedupes against what just landed.
    for (const entry of queue) {
      if (!state.entries.includes(entry)) continue;
      entry.status = "importing";
      entry.message = "";
      bpBatchRender();
      try {
        await bpBatchImportOne(entry);
        entry.status = "done";
      } catch (e) {
        entry.status = "error";
        entry.message = String((e && e.message) || e).slice(0, 160);
      }
      bpBatchRender();
    }
    state.accounts = await bpBankKnownAccounts();
    window.bpImportTarget = "";
  } finally {
    state.busy = false;
    bpBatchRender();
  }
};

async function verifyWorkbook(file) {
  const out = document.getElementById("vres");
  out.innerHTML = `<div class="muted">checking…</div>`;
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: "array", cellDates: false });
    const store = await import("./db.js");
    const profile = window.bpVerifyProfile || window.bpProfile || null;
    if (!window.bpAssetPlan) {
      try {
        const res = await fetch("./profiles/family-assets-plan.json", { cache: "no-store" });
        if (res.ok) window.bpAssetPlan = await res.json();
      } catch (e) {}
    }
    const results = [];
    for (let i = 0; i < wb.SheetNames.length; i++) {
      const name = wb.SheetNames[i];
      const matrix = sheetRows(wb.Sheets[name]);
      const rawMatrix = sheetRows(wb.Sheets[name], true);
      const sp = profileFor(profile, i);
      const row = { i, name, purpose: sp?.purpose || "generic", asset: "—",
        category: "unknown", expected: 0, present: 0, missing: 0, dup: 0,
        breaks: 0, status: "skipped" };
      if (sp && sp.importable === false) { row.status = "not importable"; results.push(row); continue; }
      if (sp && sp.purpose === "register") {
      const planOk = window.bpAssetPlan
        && Number(window.bpAssetPlan.sheet_index) === i
        && /description/i.test(String(matrix[0]?.[0] || ""))
        && /amount/i.test(String(matrix[0]?.[1] || ""));
      const rp = planOk ? applyAssetPlan(matrix, window.bpAssetPlan, rawMatrix)
        : parseSheet(matrix, sp, rawMatrix);
      row.expected = rp.rows.length;
      row.asset = `Register (sheet ${i + 1})`;
      row.category = "other";
      const ids = new Set(rp.rows.map((r) => `register-${i + 1}-${r.source_row}`));
      const assets = await store.listAccounts();
      row.present = assets.filter((a) => ids.has(a.id)).length;
      row.missing = row.expected - row.present;
      row.status = row.missing ? "missing" : "ok";
      results.push(row); continue;
    }
    if (sp && sp.purpose === "holdings") {
        const hp = parseSheet(matrix, sp);
        row.expected = hp.rows.length;
        row.category = "demat";
        row.asset = safeId(sp.asset_id) || `holdings-${i + 1}`;
        const lots = await store.listHoldings(row.asset);
        const held = new Set(lots.map((l) => l.security_id));
        const missing = hp.rows.filter((r) => r.security_id && !held.has(r.security_id)).length;
        row.missing = missing; row.present = row.expected - missing;
        row.status = missing ? "missing" : "ok";
        results.push(row); continue;
      }
      let parsed;
      if (sp && sp.purpose === "transactions") parsed = parseSheet(matrix, sp);
      else parsed = parseStatement(matrix);
      if (parsed.error || !parsed.rows.length) {
        row.status = parsed.error || "no rows"; results.push(row); continue;
      }
      row.expected = parsed.rows.length;
      const header = parsed.headerRow || parsed.header || 1;
      const pre = scanPreamble(matrix, Math.max(0, header - 1));
      const accounts = (await store.listAccounts())
        .filter((a) => ["bank", "cash"].includes(categoryOf(a)));
      const guess = guessAccount(pre, accounts);
      let matchId = guess && guess.confidence !== "low" ? guess.id : "";
      if (!matchId) {
        const fallback = slug(sp?.account_label || name);
        const asset = accounts.find((a) => a.id === fallback);
        if (asset) matchId = asset.id;
      }
      if (!matchId) {
        row.missing = row.expected; row.asset = "no match"; row.status = "unmatched";
        row.missingRows = parsed.rows.slice(0, 6)
          .map((r) => r.source_row).filter(Boolean);
        results.push(row); continue;
      }
      const matched = accounts.find((a) => a.id === matchId);
      row.asset = matched?.label || matchId;
      row.category = matched?.category || "bank";
      const plan = await store.planImport(matchId, parsed.rows);
      row.dup = plan.held; row.missing = plan.missing;
      row.missingRows = plan.missingRows || [];
      row.suspect = (plan.suspectRows || []).length;
      row.suspectRows = plan.suspectRows || [];
      row.present = plan.rows - plan.missing;
      const issues = await store.query(
        "SELECT COUNT(*) AS n FROM issue WHERE account_id=? AND state='open'", [matchId]);
      row.breaks = issues[0]?.n || 0;
      row.status = row.missing ? "missing"
        : row.suspect ? "suspect" : row.breaks ? "breaks" : "ok";
      results.push(row);
    }
    for (const r of results) {
      const srcRows = [...new Set([...(r.missingRows || []), ...(r.suspectRows || [])])]
        .slice(0, 6);
      if (!srcRows.length) continue;
      const matrix = sheetRows(wb.Sheets[wb.SheetNames[r.i]]);
      const sp = profileFor(profile, r.i);
      let maxCols = 1;
      for (const row of matrix) if (row.length > maxCols) maxCols = row.length;
      const cols = sp?.columns?.length
        ? sp.columns.map((c) => c.col)
        : Array.from({ length: Math.min(12, maxCols) },
          (_, i) => String.fromCharCode(65 + i));
      r.sampleShapes = srcRows.map((srcRow) => {
        const row = matrix[srcRow - 1] || [];
        return { row: srcRow, cells: cols.map((col) => ({
          col, shape: shape(row[colIndex(col)]) })) };
      });
    }
    const missing = results.reduce((n, r) => n + r.missing, 0);
    const breaks = results.reduce((n, r) => n + r.breaks, 0);
    const totalRows = results.reduce((n, r) => n + r.expected, 0);
    const body = results.map((r) => `<tr><td>${r.i + 1}</td><td>${esc(r.purpose)}</td>
      <td>${esc(r.asset)}</td><td class="n">${r.expected}</td><td class="n">${r.present}</td>
      <td class="n ${r.missing ? "neg" : ""}">${r.missing}</td>
      <td class="n ${r.suspect ? "neg" : ""}">${r.suspect || 0}</td>
      <td class="n">${r.dup}</td><td class="n">${r.breaks}</td><td>${esc(r.status)}</td></tr>`).join("");
    const summary = ["BANKPIPE VERIFICATION", `generated: ${new Date().toISOString()}`,
      `sheets: ${results.length}`, `rows: ${totalRows}`, `missing: ${missing}`, "",
      "sheet purpose asset expected present missing duplicates balance_breaks status",
      ...results.map((r) => [r.i + 1, r.purpose, r.category, r.expected, r.present,
        r.missing, r.suspect || 0, r.dup, r.breaks, r.status].join(" | "))].join("\n");
    window.bpVerifySummary = summary;
    window.bpVerifyJson = JSON.stringify({ generated: new Date().toISOString(),
      sheets: results.map((r) => ({ i: r.i, purpose: r.purpose,
        asset_category: r.category,
        expected: r.expected, present: r.present, missing: r.missing,
        suspect: r.suspect || 0, duplicates: r.dup, breaks: r.breaks,
        status: r.status, missing_rows: r.missingRows || [],
        suspect_rows: r.suspectRows || [],
        sample_shapes: r.sampleShapes || [] })) }, null, 2);
    out.innerHTML = `<div class="pill ${missing || breaks ? "warn" : "ok"}">${missing
      ? missing + " row" + (missing === 1 ? "" : "s") + " missing"
      : "all rows present"}${breaks ? ` · ${breaks} balance break${breaks === 1 ? "" : "s"} to review` : ""}</div>
      <table style="margin-top:10px"><tr><th>Sheet</th><th>Purpose</th><th>Asset</th>
      <th class="n">Rows</th><th class="n">Present</th><th class="n">Missing</th>
      <th class="n">Suspect</th><th class="n">Dup</th><th class="n">Breaks</th>
      <th>Status</th></tr>${body}</table>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" onclick="bpVerifyDownload()">Download summary</button>
        <button class="btn" onclick="bpVerifyDownloadJson()">Download JSON</button>
        <button class="btn" onclick="go('import')">Back to import</button></div>`;
  } catch (e) {
    out.innerHTML = `<div class="card pad">verify error: ${esc(String(e.message || e))}</div>`;
  }
}

      ${r.value_paise === null || r.value_paise === undefined ? "" : `<br>${money(r.value_paise)}`}</div>
  </div>`;
  const added = diff.added.map((r) => rowHtml(r, "add", "+", "new")).join("");
  const removed = diff.removed.map((r) => rowHtml(r, "del", "−", "not in file")).join("");
  const changed = diff.changed.map((c) => {
    const bits = [];
    if (c.fields.includes("quantity")) bits.push(`qty ${c.before.quantity ?? "—"} → ${c.after.quantity ?? "—"}`);
    if (c.fields.includes("value_paise")) bits.push(`value ${c.before.value_paise === null ? "—" : money(c.before.value_paise)} → ${c.after.value_paise === null ? "—" : money(c.after.value_paise)}`);
    if (c.fields.includes("cost_paise")) bits.push("cost changed");
    return rowHtml(c.after, "chg", "~", bits.join(" · ") || "changed");

  const totalCost = sum(rows, "cost_paise");
  const totalValue = sum(rows, "value_paise");
  host.innerHTML = `<div class="card pad">
    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline">

      <div><div class="k">Existing rows</div><div class="v">${before.length}</div></div>
    </div>
    ${added + removed + changed ? `<div style="margin-top:10px">${added}${removed}${changed}</div>`
      : `<div class="muted" style="font-size:12px;margin-top:10px">No changes — the file matches
        the holdings on this asset.</div>`}
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
      <button class="btn" onclick="bpHoldingsApply(${jsArg(id)})">Apply this snapshot</button>
      <button class="btn" onclick="go('import')">Cancel</button>
    </div>
    <div class="muted" style="font-size:11.5px;margin-top:8px">Applying replaces the holdings
    on this asset with the file. A local version is saved first; removed lines disappear from
    the current holding list.</div>
  </div>`;
};
window.bpHoldingsApply = async (id) => {

  if (!confirm(`Replace the holdings on this asset with ${rows.length} rows from `
    + `${window.bpHoldingsFileName || "the file"}? A local version is saved first.`)) return;
  try {
    const store = await import("./db.js");
    const all = await store.listAccounts();
    const asset = all.find((a) => a.id === id);
    if (!asset) throw new Error("asset not found");
    const cat = categoryOf(asset);
    const today = new Date().toISOString().slice(0, 10);
    try { await store.snapshotDb("Before holdings import"); } catch (e) {}
    const filled = rows.map((r) => ({ ...r,
      category: r.category || (cat === "bonds" ? "bond" : "equity") }));
    await store.replaceHoldings(id, filled, today);
    const meta = metaOf(asset);
    await store.updateAccount(id, { meta: JSON.stringify({ ...meta,
      holdings_source: "import", holdings_as_of: today,
      holdings_file: window.bpHoldingsFileName || "" }) });
    window.bpHoldingsRows = null;
    window.bpHoldingsFileName = null;
    window.bpAsset(id);

    alert("Could not import the holdings: " + (e.message || e));

};

// Last four digits of a Demat, digits only, for the "…1234" labels.
function dematLast4(value) {
  return String(value ?? "").replace(/\D+/g, "").slice(-4);
}

// The Demat a portfolio is already known by: the number a previous sync mapped
// to it, else the portfolio's own field.
async function digiFinnTargetDemat(asset) {
  if (!asset) return "";
  try {
    const store = await import("./db.js");
    const raw = await store.getSetting("bp.digifinn.demat");
    const map = raw ? JSON.parse(raw) : {};
    for (const [demat, id] of Object.entries(map)) if (id === asset.id) return demat;
  } catch (e) {}
  return asset.number || "";
}

// The red card above the sync detail. Empty when the Demats agree, or when
// either side is unknown: a portfolio with no Demat yet is being linked for the
// first time, and that import is allowed.
function digiFinnDematCardHtml(target, targetDemat) {
  const data = window.bpDigiFinnReviewData;
  if (!data || !target || target === "__new__") return "";
  const reportDemat = data.state.portfolio.demat || "";
  if (matchDemat(reportDemat, targetDemat) !== "mismatch") return "";
  const mapped = data.mapped || "";
  const mappedAsset = data.mappedEntry?.asset || null;
  const bestId = data.recommendedId || "";
  const bestAsset = bestId
    ? (data.scored.find((x) => x.asset.id === bestId)?.asset || null) : null;
  const actions = [];
  if (mapped && mapped !== target) {
    actions.push(`<button class="btn" onclick="bpDigiFinnSyncPreview(${jsArg(mapped)})">Import into ${esc(mappedAsset?.label || mapped)}</button>`);
  }
  if (bestAsset && data.clearBest && bestId !== target && bestId !== mapped) {
    actions.push(`<button class="btn" onclick="bpDigiFinnSyncPreview(${jsArg(bestId)})">Use ${esc(bestAsset.label || bestId)}</button>`);
  }
  actions.push(`<button class="btn" onclick="bpDigiFinnSyncPreview('__new__')">Create a portfolio for …${esc(dematLast4(reportDemat))}</button>`);
  actions.push(`<button class="btn" onclick="bpDigiFinnKeepPortfolio()">Keep this portfolio</button>`);
  return `<div class="card pad" style="border:1px solid var(--red);margin-bottom:10px">
    <b style="color:var(--red);font-size:13.5px">These reports are for Demat
      …${esc(dematLast4(reportDemat))}, not this portfolio (…${esc(dematLast4(targetDemat))}).</b>
    <div class="muted" style="font-size:12px;margin-top:5px">Choose where this snapshot belongs.
      Nothing is written until you apply.</div>

}

window.bpDigiFinnSyncApply = async () => {
  const state = window.bpDigiFinnReports;
  const sync = window.bpDigiFinnSync;
  const target = window.bpDigiFinnTarget;
  if (!state || !sync || !target) return;
  // Reports for another Demat are refused until the person says "Import anyway".
  const dematState = window.bpDigiFinnDemat || {};
  if (dematState.target === target && dematState.mismatch
    && window.bpDigiFinnOverride !== true) {
    alert("These reports belong to a different Demat. Use 'Import anyway' if you are sure.");
    return;
  }
  const store = await import("./db.js");
  let targetId = target;
  const warningText = (window.bpDigiFinnWarnings || []).length
    ? `\n\n${window.bpDigiFinnWarnings.join("\n")}` : "";
  if (target === "__new__") {
    const name = (document.getElementById("df-new-name")?.value || "").trim()
      || `Bonds · DigiFInn ${(state.portfolio.demat || "").slice(-4)}`;
    const base = slug(name);
    const all = await store.listAccounts();
    targetId = base;
    let n = 2;
    while (all.some((a) => a.id === targetId)) targetId = `${base}-${n++}`;
    if (!confirm(`Create “${name}” and import ${sync.current} current lots?${warningText}`)) return;
    await store.createAccount({ id: targetId, label: name, category: "bonds", subtype: "bond" });
  } else {
    const mapped = window.bpDigiFinnMapped || "";
    const extra = mapped && mapped !== target
      ? `\n\nThis Demat is currently mapped to ${window.bpDigiFinnMappedLabel || mapped}. Applying here will move the mapping.`
      : "";
    if (!confirm(`Replace the holdings on this portfolio with ${sync.current} current lots?${warningText}${extra}`)) {
      return;
    }
  }
  try {
    try { await store.snapshotDb("Before DigiFInn bond sync"); } catch (e) {}
    const today = new Date().toISOString().slice(0, 10);
    await store.replaceHoldings(targetId, sync.holdings, today);
    const all = await store.listAccounts();
    const asset = all.find((a) => a.id === targetId);
    const meta = metaOf(asset);
    await store.updateAccount(targetId, { meta: JSON.stringify({ ...meta,
      holdings_source: "digifinn-reports", holdings_as_of: today,
      holdings_file: [state.files.portfolio, state.files.investment, state.files.payouts]
        .filter(Boolean).join(" + ") }) });
    if (state.portfolio.demat) {
      try {
        const raw = await store.getSetting("bp.digifinn.demat");
        const map = raw ? JSON.parse(raw) : {};
        map[state.portfolio.demat] = targetId;
        await store.setSetting("bp.digifinn.demat", JSON.stringify(map));
      } catch (e) {}
      // The holder block stays in the encrypted database. The name and the
      // demat number are shown back on the portfolio's own page; nothing here
      // is logged or included in diagnostics.
      const identity = state.portfolio.identity || {};
      if (Object.keys(identity).length) {
        try {
          const raw = await store.getSetting("digifinn.identity");
          const map = raw ? JSON.parse(raw) : {};
          map[state.portfolio.demat] = { ...identity, as_of: today, portfolio: targetId };
          await store.setSetting("digifinn.identity", JSON.stringify(map));
        } catch (e) {}
      }
      // A bond portfolio is the demat account that holds it, so fill the fields
      // a person would otherwise copy across from DigiFInn by hand.
      const patch = importFillPlan(asset || {}, {
        demat: state.portfolio.demat,
        holder: identity.name,
        broker: bondBroker("digifinn")?.label || "DigiFInn",
      });
      if (Object.keys(patch).length) await store.updateAccount(targetId, patch);
    }
    window.bpDigiFinnReports = null;
    window.bpDigiFinnSync = null;
    window.bpDigiFinnSyncTarget = "";
    window.bpDigiFinnOverride = false;
    window.bpDigiFinnDemat = null;
    window.bpAsset(targetId);
  } catch (e) {
    alert("Could not apply the DigiFInn sync: " + (e.message || e));
  }
};

function slug(s) {
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 28)
    || "account";
}
// sheet_to_json starts at the used range, not at A1. A sheet whose range is
// B2:J35 would shift every column and row by one. Normalise it back to A1 so
// the profile's column letters mean the column the user sees in Excel.
function sheetRows(ws, raw = false) {
  const range = XLSX.utils.decode_range(ws["!ref"] || "A1");
  const cells = XLSX.utils.sheet_to_json(ws, { header: 1, raw, defval: "" });
  if (!range.s.r && !range.s.c) return cells;
  const out = [];
  for (let i = 0; i < range.s.r; i++) out.push([]);
  for (const row of cells) out.push([...Array(range.s.c).fill(""), ...row]);
  return out;
}
async function ssotGet(key, fallback = null) {
  try {
    const store = await import("./db.js");
    const raw = await store.getSetting(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) {
    return fallback;
  }
}
async function ssotSet(key, value) {
  const store = await import("./db.js");
  await store.setSetting(key, JSON.stringify(value));
}
async function loadTotalSupplement() {
  return ssotGet(SSOT_KEYS.totalSupplement, []);
}
async function loadAccountMeta() {
  return ssotGet(SSOT_KEYS.accountMeta, {});
}
async function loadOwnerMap() {
  return ssotGet(SSOT_KEYS.owners, {});
}
async function loadWorkbookTotals() {
  const saved = await ssotGet(SSOT_KEYS.workbookTotals, null);
  if (saved) return saved;
  // One-time lift of the old localStorage value; the sealed setting wins after.
  try {
    const legacy = JSON.parse(localStorage.getItem("bp.workbookTotals") || "null");
    if (legacy) {
      await ssotSet(SSOT_KEYS.workbookTotals, legacy);
      localStorage.removeItem("bp.workbookTotals");
      localStorage.removeItem("bp.workbookTotal");
      return legacy;
    }
  } catch (e) {}
  return null;
}
async function restoreManualAccounts(store, snapshot) {
  if (!snapshot?.length) return 0;
  const updates = manualUpdates(await store.listAccounts(), snapshot);
  for (const { id, update } of updates) await store.updateAccount(id, update);
  return updates.length;
}
async function importWorkbook(file) {

    || document.getElementById("reimport-status");

  const ownerMap = await loadOwnerMap();
  const accountMeta = await loadAccountMeta();
  let assetPlan = window.bpAssetPlan || null;
  if (!assetPlan) {
    try {
      const res = await fetch("./profiles/family-assets-plan.json", { cache: "no-store" });
      if (res.ok) { assetPlan = await res.json(); window.bpAssetPlan = assetPlan; }
    } catch (e) {}
  }
  const XLSXlib = window.XLSX;
  const buf = await file.arrayBuffer();
  const ext = (file.name.match(/\.([^.]+)$/) || [, ""])[1].toLowerCase();
  const meta = { ext, bytes: buf.byteLength, sha256: await sha256Hex(buf) };
  const wb = XLSXlib.read(buf, { type: "array", cellDates: false });
  showImportProgress(10, "Workbook loaded", `${wb.SheetNames.length} sheets to read.`);
  // Keep the workbook's own TOTAL so Home can show it next to BankPipe's net
  // worth. They are different models, not two attempts at the same number.
  let workbookTotalPaise = null;

  try {
    const totalRows = sheetRows(wb.Sheets[wb.SheetNames[0]], true);
    for (const row of totalRows) {
      const label = String(row[1] ?? "").trim();
      const value = typeof row[0] === "number" ? Math.round(row[0] * 100) : null;
      if (label.toUpperCase() === "TOTAL" && value !== null && row[0] > 0) {
        workbookTotalPaise = value;
      }

      if (/icici demat/i.test(label) && value !== null) workbookParts.iciciDemat = value;
    }

      if (typeof j40 === "number") workbookParts.fdMf = Math.round(j40 * 100);

    const rawRows = sheetRows(wb.Sheets[name], true);

    if (!wb || wb.total === null || wb.total === undefined) {
      host.innerHTML = `<h1>Workbook reconciliation</h1>
        <div class="card pad"><b>No workbook TOTAL recorded yet.</b>
        <p class="muted" style="font-size:13px">Re-import the original workbook once; the

        <button class="btn" onclick="go('home')">Back to home</button></div>`;
      return;
    }
    const sum = (pred) => totalAssets(assets.filter(pred));
    const appGold = sum((a) => categoryOf(a) === "gold");
    const appBob = sum((a) => categoryOf(a) === "bank"
      && /baroda/i.test(`${a.bank || ""} ${a.label || ""}`));
    const appFdMf = sum((a) => categoryOf(a) === "fd"
      || (categoryOf(a) === "demat" && /mutual fund/i.test(a.subtype || "")));
    const appIns = sum((a) => categoryOf(a) === "insurance");
    const today = new Date().toISOString().slice(0, 10);
    const maturedFd = assets.filter((a) => categoryOf(a) === "fd"
      && a.maturity_date && a.maturity_date < today)
      .reduce((t, a) => t + (assetMetrics(a, "fd").value || 0), 0);
    const appFdMfAll = appFdMf + maturedFd;
    const items = [
      ["Gold is in BankPipe but not in TOTAL", appGold, 0],
      ["BOB savings uses the latest statement", appBob, wb.bob],
      ["FD + mutual funds, including matured", appFdMfAll, wb.fdMf],
      ["Matured FDs are history, not assets", 0, maturedFd],
      ["ICICI demat holding is not imported", 0, wb.iciciDemat],
      ["Insurance includes the two LIC premiums", appIns, wb.insurance],
    ].filter(([, app, book]) => (app || 0) !== 0 || (book || 0) !== 0)
      .map(([label, app, book]) => ({ label, app: app || 0, book: book || 0,
        delta: (app || 0) - (book || 0) }));
    const explained = items.reduce((n, x) => n + x.delta, 0);
    const residual = total - wb.total - explained;
    const rows = items.map((x) => `<tr><td>${x.label}</td>
      <td class="n">${x.app ? money(x.app) : "—"}</td>
      <td class="n">${x.book ? money(x.book) : "—"}</td>
      <td class="n ${x.delta < 0 ? "neg" : "pos"}">${x.delta < 0 ? "−" : "+"}${money(Math.abs(x.delta))}</td></tr>`).join("");
    const residualRow = Math.abs(residual) >= 1 ? `<tr><td>Rounding / other</td>
      <td class="n">—</td><td class="n">—</td>
      <td class="n ${residual < 0 ? "neg" : "pos"}">${residual < 0 ? "−" : "+"}${money(Math.abs(residual))}</td></tr>` : "";
    host.innerHTML = `<h1>Workbook reconciliation</h1>
      <div class="hero"><div class="lbl">BankPipe net worth</div>
        <div class="num">${money(total)}</div>
        <div class="chips"><span>Workbook TOTAL ${money(wb.total)}</span>
          <span>BankPipe ${money(Math.abs(total - wb.total))} ${total >= wb.total ? "higher" : "lower"}</span></div></div>
      <div class="card pad" style="margin-top:14px"><b>Why they differ</b>
        <p class="muted" style="font-size:13px;margin:6px 0 10px">The workbook TOTAL is a
        mixed total: it leaves out gold, uses older bank/FD values and counts only some
        insurance premiums. BankPipe uses the latest statements, FD accrual and all
        premiums paid.</p>
        <table><tr><th>Item</th><th class="n">BankPipe</th>
          <th class="n">Workbook</th><th class="n">Difference</th></tr>${rows}${residualRow}</table>
        <div class="muted" style="font-size:11.5px;margin-top:10px;line-height:1.5">
          The workbook FD32 still contains the four matured FDs, so they appear as their own
          subtraction above. The ₹2,61,339.71 FD/MF line is: BOB FD 0098 at ₹4,00,000 principal
          vs ₹2,00,000 inside FD32 (+₹2,00,000), BOB FD 1024 at ₹20,000 vs ₹28,449 (−₹8,449),
          accrued interest on the two SCB FDs (+₹59,788.71), and the ₹10,000 PNB PPF outside
          FD32 (+₹10,000). Without the matured-FD treatment the gap was ₹11,17,059.91; with it
          the remaining ₹5,056.25 is the net of the rows above and ₹1 of workbook rounding.
          Bonsai reviewed the bridge and found no missing TOTAL line.</div>
        <div style="margin-top:12px"><button class="btn" onclick="go('home')">Back to home</button></div></div>`;
  } catch (e) {
    host.innerHTML = `<h1>Workbook reconciliation</h1><div class="card pad">${esc(String(e.message || e))}</div>`;
  }
};

      if (!Number.isFinite(n)) { fail("That is not a number."); return; }
      value = n;

function sunPlace(items, startPct, spanPct, gap = 0.4) {
  const live = items.filter((x) => Number(x.value) > 0);
  if (!live.length || spanPct <= 0) return [];
  const sum = live.reduce((t, x) => t + Number(x.value), 0) || 1;
  const usable = Math.max(0, spanPct - gap * Math.max(0, live.length - 1));
  let acc = startPct;
  const out = [];
  live.forEach((x, i) => {
    const w = (Number(x.value) / sum) * usable;
    out.push({ item: x, start: acc, end: acc + w, width: w });
    acc += w + (i < live.length - 1 ? gap : 0);
  });
  return out;
}
function sunArc(items, startPct, spanPct, gap = 0.4) {
  return sunPlace(items, startPct, spanPct, gap).map((p) => `${p.item.color} ${p.start}% ${p.end}%`);
}

async function findFdAccount(store, fd, accounts) {
  const digits = String(fd.number || "").replace(/\D/g, "");
  const tail = digits.slice(-6);
  const principal = Number(fd.principal_paise) || 0;
  const start = fd.start_date || "";
  const shift = (iso, n) => {
    const d = new Date(String(iso || "") + "T00:00:00Z");
    if (isNaN(d.getTime())) return iso;
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  };
  for (const acc of accounts) {
    if (tail.length >= 4) {
      const rows = await store.query(
        "SELECT txn_date, amount_paise, narration FROM fact WHERE account_id=?"
        + " AND amount_paise < 0 AND narration LIKE ? ORDER BY txn_date DESC",
        [acc.id, `%${tail}%`]);
      const hit = rows.find((r) => !principal
        || Math.abs(Math.abs(Number(r.amount_paise) || 0) - principal) <= Math.max(10000, principal * 0.05));
      if (hit) return { acc, why: "FD number in the statement" };
    }
    if (principal && start) {
      const rows = await store.query(
        "SELECT txn_date, amount_paise, narration FROM fact WHERE account_id=?"
        + " AND amount_paise < 0 AND txn_date BETWEEN ? AND ?"
        + " AND ABS(ABS(amount_paise) - ?) <= ? ORDER BY txn_date",
        [acc.id, shift(start, -45), shift(start, 45), principal, Math.max(10000, principal * 0.02)]);
      if (rows.length) return { acc, why: "principal debit near the start date" };
    }
  }
  return null;
}
async function linkFds(store, groups) {
  const map = new Map();
  for (const g of groups) {
    for (const fd of g.fds) {
      const meta = metaOf(fd);
      let linked = meta.linked_account_id || "";
      if (!g.accounts.some((a) => a.id === linked)) linked = "";
      if (!linked && meta.linked_why === "unlinked by hand") {
        map.set(fd.id, "");
        continue;
      }
      if (!linked) {
        const found = await findFdAccount(store, fd, g.accounts);
        if (found) {
          linked = found.acc.id;
          await store.updateAccount(fd.id, { meta: JSON.stringify({
            ...meta, linked_account_id: linked, linked_why: found.why,
          }) });
        }
      }
      map.set(fd.id, linked);
    }
  }
  return map;
}

function suggestLocker(payments, existing, branch) {
  if ((existing || []).length) return null;
  const rows = (payments || []).filter((r) => Number(r.amount_paise) < 0
    && !/deposit|security|caution/i.test(r.narration || ""));
  if (!rows.length) return null;
  const byDate = new Map();
  for (const r of rows) {
    const d = String(r.txn_date || "");
    if (!d) continue;
    const list = byDate.get(d) || [];
    list.push(Math.abs(Number(r.amount_paise) || 0));
    byDate.set(d, list);
  }
  const dates = [...byDate.keys()].sort();
  if (dates.length < 2) return null;
  const counts = new Map();
  for (const [, amounts] of byDate) for (const a of amounts) {
    counts.set(a, (counts.get(a) || 0) + 1);
  }
  let typical = 0, best = 0;
  for (const [a, n] of counts) {
    if (n > best || (n === best && a > typical)) { typical = a; best = n; }
  }
  if (!typical) typical = Math.abs(Number(rows[0].amount_paise) || 0);
  const lastDate = dates[dates.length - 1];
  const next = new Date(lastDate + "T00:00:00Z");
  if (isNaN(next.getTime())) return null;
  next.setUTCFullYear(next.getUTCFullYear() + 1);
  const today = new Date().toISOString().slice(0, 10);
  while (next.toISOString().slice(0, 10) < today) next.setUTCFullYear(next.getUTCFullYear() + 1);
  const renewal = next.toISOString().slice(0, 10);
  let number = "";
  const amounts = new Set(rows.map((r) =>
    Math.round(Math.abs(Number(r.amount_paise) || 0) / 100)));
  for (const r of rows) {
    // Only take a number when the narration explicitly labels it as the
    // locker number; otherwise leave it for the user to fill in.
    const m = String(r.narration || "").match(/\blocker\s*(?:no\.?|number|#)\s*[:#-]?\s*(\d{1,4})\b/i);
    if (!m) continue;
    const n = Number(m[1]);
    if (n >= 1 && n <= 9999 && !amounts.has(n)
        && !(n >= 1900 && n <= 2100)) { number = m[1]; break; }
  }
  return { count: dates.length, first: dates[0], last: lastDate,
    typical, renewal, number, branch: branch || "" };
}

  wrap.addEventListener("click", async (e) => {
    const b = e.target.closest("[data-act]");

    if (b.dataset.act === "download") {

      try { await store.clearAll(); } catch (e) { console.warn("clearAll failed", e); }
      for (const k of Object.keys(localStorage)) {

window.bpConfirmReimport = async () => {
