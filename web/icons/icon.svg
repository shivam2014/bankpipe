<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="BankPipe">
  <!-- The app's own mark: the header's rounded square (linear-gradient(140deg,
       #0a5741, #12a077)) with the rupee in white. No new brand was invented. -->
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a5741"/>
      <stop offset="1" stop-color="#12a077"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#mark)"/>
  <text x="256" y="330" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
    font-size="280" font-weight="700" fill="#ffffff">₹</text>
</svg>
